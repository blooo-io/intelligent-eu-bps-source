version: 2
# INT-410 — raise open PR limits so advisory backlog can drain; keep Nest/React
# grouped (INT-323). Agents still squash-merge green Dependabot PRs (INT-322)
# until org auto-merge is enabled on the repository.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    # INT-412 — vitest 5 drops branch coverage below 80% across modules;
    # vitepress-openapi ≥0.2.14 breaks docs SSR (`useData`).
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitepress-openapi"
        versions: [">=0.2.13"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
