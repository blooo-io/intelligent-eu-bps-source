# Initial CI skeleton. Build, test and image jobs are added with the first modules (Jira BLD tasks).
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (MIT), CLI in container, no licence key needed
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install contract tooling
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI and AsyncAPI contracts
        run: pnpm contracts:lint
      - name: Block an unannounced breaking change
        run: |
          git fetch origin develop --depth=1
          if git cat-file -e FETCH_HEAD:contracts/openapi/public.v1.yaml 2>/dev/null; then
            git show FETCH_HEAD:contracts/openapi/public.v1.yaml > /tmp/public.base.yaml
            docker run --rm -v "$PWD:/work" -v /tmp/public.base.yaml:/base.yaml \
              tufin/oasdiff:latest breaking /base.yaml /work/contracts/openapi/public.v1.yaml
          else
            echo "No public contract on develop yet"
          fi
      - name: Validate EWDS topic schemas against their examples
        run: |
          for t in billingInvoice billingPayment; do
            npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats \
              -s docs/architecture/ewds-topics/$t.v1.0.0.schema.json \
              -d docs/architecture/ewds-topics/$t.example.json
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run every test script and enforce 80% coverage per module
        run: node scripts/run-tests.mjs
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 14
