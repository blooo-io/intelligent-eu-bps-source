# Initial CI skeleton. Build, test and image jobs are added with the first modules (Jira BLD tasks).
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (MIT), CLI in container, no licence key needed
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install contract tooling
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI and AsyncAPI contracts
        run: pnpm contracts:lint
      - name: Block an unannounced breaking change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          if git cat-file -e "$BASE_SHA:contracts/openapi/public.v1.yaml" 2>/dev/null; then
            mkdir -p /tmp/base
            git archive "$BASE_SHA" contracts/openapi | tar -x -C /tmp/base
            docker run --rm -v "$PWD:/work:ro" -v /tmp/base:/base:ro \
              tufin/oasdiff:latest breaking \
              /base/contracts/openapi/public.v1.yaml \
              /work/contracts/openapi/public.v1.yaml
          else
            echo "No public contract at base commit $BASE_SHA"
          fi
      - name: Validate EWDS topic schemas against their examples
        run: |
          for t in billingInvoice billingPayment; do
            npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats \
              -s docs/architecture/ewds-topics/$t.v1.0.0.schema.json \
              -d docs/architecture/ewds-topics/$t.example.json
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run every test script and enforce 80% coverage per module
        run: node scripts/run-tests.mjs
      - name: Reject coding-assistant attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/commit-attribution.mjs --check-range "$BASE_SHA"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 14

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint module Helm charts
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/work" -w /work alpine/helm:3.18.4 -c '
            set -eu
            for chart in deploy/charts/*; do
              name=$(basename "$chart")
              if [ "$name" = module ]; then
                continue
              fi
              helm dependency build "$chart"
              helm lint "$chart" -f deploy/envs/dev/values.yaml
            done
          '
