# Tests, contract checks, secret scanning, dependency scanning and module images.
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks (MIT), CLI in container, no licence key needed
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
      # INT-325 — Keycloak client secrets / UAT passwords must not live in GitOps packaging.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Forbid Keycloak secrets in realm JSON and module values
        run: node --test scripts/forbid-keycloak-git-secrets.mjs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # INT-318 — need HEAD^ when github.event.before is all zeros.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install contract tooling
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI and AsyncAPI contracts
        run: pnpm contracts:lint
      - name: Block an unannounced breaking change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # INT-318 — push events can set before=000…0 (mirror / rewritten tip).
          # Fall back to the first parent so oasdiff still has a real base.
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD^)"
              echo "BASE_SHA was empty/zero; using first parent $BASE_SHA"
            else
              echo "No usable base SHA; skipping oasdiff breaking check"
              exit 0
            fi
          fi
          git fetch origin "$BASE_SHA" --depth=1
          if git cat-file -e "$BASE_SHA:contracts/openapi/public.v1.yaml" 2>/dev/null; then
            mkdir -p /tmp/base
            git archive "$BASE_SHA" contracts/openapi | tar -x -C /tmp/base
            docker run --rm -v "$PWD:/work:ro" -v /tmp/base:/base:ro \
              tufin/oasdiff:latest breaking \
              /base/contracts/openapi/public.v1.yaml \
              /work/contracts/openapi/public.v1.yaml
          else
            echo "No public contract at base commit $BASE_SHA"
          fi
      - name: Validate EWDS topic schemas against their examples
        # INT-101 — use workspace ajv (not npx ajv-cli): hoisted ajv-formats ESM
        # breaks ajv-cli's CommonJS `-c ajv-formats` loader.
        run: node scripts/validate-ewds-schemas.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Run every test script and enforce 80% coverage per module
        run: node scripts/run-tests.mjs
      - name: Reject coding-assistant attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/commit-attribution.mjs --check-range "$BASE_SHA"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 14

  # INT-291 — SonarQube / SonarCloud quality gate (skips until SONAR_TOKEN is set).
  sonarqube:
    name: sonarqube
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Resolve lcov report paths
        id: lcov
        run: node scripts/sonar-lcov-paths.mjs --github

      - name: Skip when SONAR_TOKEN is not configured
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN secret missing — Sonar scan skipped. See docs/release/sonarqube.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Scan (CLI)
        if: steps.gate.outputs.configured == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'blooo-io' }}
          SONAR_LCOV_REPORT_PATHS: ${{ steps.lcov.outputs.lcov_report_paths }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-scan.mjs

  # INT-135: lint every module chart against the shared module library.
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint module Helm charts
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/work" -w /work alpine/helm:3.18.4 -c '
            set -eu
            for chart in deploy/charts/*; do
              name=$(basename "$chart")
              if [ "$name" = module ]; then
                continue
              fi
              helm dependency build "$chart"
              helm lint "$chart" -f deploy/envs/dev/values.yaml
            done
          '

  # INT-176: supply-chain (Trivy + module images) runs post-merge on develop
  # only — see .github/workflows/supply-chain.yml. PR CI stays fast.
