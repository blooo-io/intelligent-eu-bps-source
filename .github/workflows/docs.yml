# INT-299 — build the VitePress public docs and publish to GitHub Pages.
name: docs

on:
  push:
    branches: [develop]
    paths:
      - "apps/site/**"
      - ".github/workflows/docs.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test docs package
        run: pnpm --filter @intelligent/site test
      # Private Pages host serves at /; use DOCS_BASE=/intelligent-eu-billing-and-payment/
      # only after the repository (or Pages visibility) is public on github.io/<repo>/.
      - name: Build VitePress site
        env:
          DOCS_BASE: /
        run: pnpm --filter @intelligent/site build
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
