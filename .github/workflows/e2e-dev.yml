# INT-184 — AC-01 E2E against the fully deployed `dev` stack (not a cloistered SPA).
# After supply-chain publishes images, roll the web Deployment so `:develop` is
# pulled, then run Playwright with E2E_BASE_URL=https://app.dev.…
#
# Triggers:
#   - workflow_run: supply-chain success on develop (continuous verification)
#   - workflow_dispatch / repository_dispatch (operator or future Argo Notifications)
#
# Requires GitHub Environment `dev` secret KUBECONFIG_INTELLIGENT_EU_DEV.
name: e2e-dev

on:
  workflow_dispatch:
  repository_dispatch:
    types: [e2e-dev]
  workflow_run:
    workflows: [supply-chain]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: e2e-dev
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: dev
    env:
      E2E_BASE_URL: https://app.dev.intelligent-eu-bp.blooo.dev
    steps:
      - name: Checkout develop (deployed revision)
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_INTELLIGENT_EU_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "Missing secret KUBECONFIG_INTELLIGENT_EU_DEV on environment dev" >&2
            exit 1
          fi
          umask 077
          mkdir -p "${HOME}/.kube"
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Verify context admin@k8s-intelligent-eu-dev
        run: |
          set -euo pipefail
          ctx="$(kubectl config current-context)"
          echo "current-context=${ctx}"
          test "${ctx}" = "admin@k8s-intelligent-eu-dev"

      - name: Roll web to pull floating :develop image (INT-178)
        run: |
          set -euo pipefail
          kubectl -n int-apps rollout restart deploy/web
          kubectl -n int-apps rollout status deploy/web --timeout=180s

      - name: Wait until the public web origin answers
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${E2E_BASE_URL}/" || true)"
            echo "attempt=${i} http=${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ${E2E_BASE_URL}/" >&2
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter @intelligent/web exec playwright install --with-deps chromium

      - name: Run AC-01 auth-gate E2E against deployed stack
        run: pnpm --filter @intelligent/web test:e2e
