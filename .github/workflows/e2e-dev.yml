# INT-184 — AC-01 E2E against the fully deployed `dev` stack (not a cloistered SPA).
# After supply-chain publishes images, roll the web Deployment so `:develop` is
# pulled, then run Playwright with E2E_BASE_URL=https://app.dev.…
#
# Triggers:
#   - workflow_run: supply-chain success on develop (continuous verification)
#   - workflow_dispatch / repository_dispatch (operator or future Argo Notifications)
#
# Requires GitHub Environment `dev` secret KUBECONFIG_INTELLIGENT_EU_DEV.
name: e2e-dev

on:
  workflow_dispatch:
  repository_dispatch:
    types: [e2e-dev]
  workflow_run:
    workflows: [supply-chain]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: e2e-dev
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: dev
    env:
      E2E_BASE_URL: https://app.dev.intelligent-eu-bp.blooo.dev
    steps:
      - name: Checkout develop (deployed revision)
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_INTELLIGENT_EU_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_CONTENT}" ]; then
            echo "Missing secret KUBECONFIG_INTELLIGENT_EU_DEV on environment dev" >&2
            exit 1
          fi
          umask 077
          mkdir -p "${HOME}/.kube"
          printf '%s\n' "${KUBECONFIG_CONTENT}" > "${HOME}/.kube/config"
          echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Verify context admin@k8s-intelligent-eu-dev
        run: |
          set -euo pipefail
          ctx="$(kubectl config current-context)"
          echo "current-context=${ctx}"
          test "${ctx}" = "admin@k8s-intelligent-eu-dev"

      - name: Roll app modules to pull floating :develop images (INT-178 / INT-229 / INT-280)
        # INT-194 — participants seed carries UAT IdP subjects for authenticated e2e.
        # INT-229 — settlement/invoicing/payments/trade-intake float on :develop;
        # Argo env-only syncs leave them on the pre-supply-chain digest.
        # INT-280 — also roll AC-08..AC-14 peers (reference-data VAT, NATS projections,
        # scheduler worker, compliance erasure). Selective IMAGE_CHANGED_ONLY builds
        # otherwise leave those pods on stale digests (e2e StartRun 404 after INT-279).
        run: |
          set -euo pipefail
          # INT-281 — continue rolling peers if one CrashLoops; fail only when a
          # billing-path module does not become ready (so VAT/StartRun e2e still run).
          critical="web participants trade-intake settlement invoicing payments reference-data"
          failed_critical=0
          for d in \
            web \
            participants \
            trade-intake \
            settlement \
            invoicing \
            payments \
            reference-data \
            notification \
            reporting \
            reconciliation \
            publication \
            compliance \
            scheduler \
            scheduler-worker \
            mocks
          do
            kubectl -n int-apps rollout restart "deploy/${d}"
            if ! kubectl -n int-apps rollout status "deploy/${d}" --timeout=180s; then
              echo "WARN: rollout status failed for deploy/${d}" >&2
              case " ${critical} " in
                *" ${d} "*) failed_critical=1 ;;
              esac
            fi
          done
          if [ "${failed_critical}" -ne 0 ]; then
            echo "Critical deploy rollout failed" >&2
            exit 1
          fi

      - name: Wait until the public web origin answers
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${E2E_BASE_URL}/" || true)"
            echo "attempt=${i} http=${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ${E2E_BASE_URL}/" >&2
          exit 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter @intelligent/web exec playwright install --with-deps chromium

      - name: Export Stripe test secret from cluster for money-path assert (INT-251)
        # Same OpenBao-synced key payments uses — no new GitHub secret; GitOps only.
        # Cluster secret key is snake_case `stripe_secret_key` (INT-186); accept uppercase alias.
        id: stripe
        run: |
          set -euo pipefail
          key="$(kubectl -n int-apps get secret payments -o jsonpath='{.data.stripe_secret_key}' | base64 -d || true)"
          if [[ -z "${key}" ]]; then
            key="$(kubectl -n int-apps get secret payments -o jsonpath='{.data.STRIPE_SECRET_KEY}' | base64 -d || true)"
          fi
          if [[ ! "${key}" =~ ^sk_test_ ]]; then
            echo "payments secret missing stripe_secret_key (sk_test_…)" >&2
            exit 1
          fi
          echo "::add-mask::${key}"
          echo "STRIPE_SECRET_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Seed fresh Open invoices for money-path (INT-251 / INT-238)
        # Port-forward AC-05/06/07 and run the NATS billing seed so Pay has an Open invoice.
        run: |
          set -euo pipefail
          kubectl -n int-apps port-forward deploy/payments 18087:8080 >/tmp/pf-payments.log 2>&1 &
          echo $! > /tmp/pf-payments.pid
          kubectl -n int-apps port-forward deploy/settlement 18085:8080 >/tmp/pf-settlement.log 2>&1 &
          echo $! > /tmp/pf-settlement.pid
          kubectl -n int-apps port-forward deploy/invoicing 18086:8080 >/tmp/pf-invoicing.log 2>&1 &
          echo $! > /tmp/pf-invoicing.pid
          cleanup() {
            for f in /tmp/pf-payments.pid /tmp/pf-settlement.pid /tmp/pf-invoicing.pid; do
              if [ -f "$f" ]; then kill "$(cat "$f")" 2>/dev/null || true; fi
            done
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:18087/health" >/dev/null \
              && curl -sf "http://127.0.0.1:18085/health" >/dev/null \
              && curl -sf "http://127.0.0.1:18086/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          PAYMENTS_URL=http://127.0.0.1:18087 \
          SETTLEMENT_URL=http://127.0.0.1:18085 \
          INVOICING_URL=http://127.0.0.1:18086 \
            node scripts/stripe-fresh-billing-run.mjs

      - name: Run AC-01 E2E against deployed stack (screens + buttons, INT-211 / INT-251)
        # INT-194 / INT-211 — three UAT IdP roles; omit E2E_SKIP_AUTH so auth suites run.
        # INT-251 — STRIPE_SECRET_KEY from previous step for Charge assertion.
        env:
          # INT-282 — human-readable demo logins (Keycloak ids unchanged).
          E2E_UAT_MEMBER_USER: hugo.petit
          E2E_UAT_MEMBER_PASSWORD: Intelligent-UAT-2026!
          E2E_UAT_MANAGER_USER: sofia.garcia
          E2E_UAT_MANAGER_PASSWORD: Intelligent-UAT-2026!
          E2E_UAT_OPERATOR_USER: paul.nguyen
          E2E_UAT_OPERATOR_PASSWORD: Intelligent-UAT-2026!
          # INT-251 / INT-282 — Léa Martin pays seeded Open invoices (S1 community).
          E2E_S1_CONSUMER_USER: lea.martin
          E2E_S1_CONSUMER_PASSWORD: Intelligent-UAT-2026!
        run: pnpm --filter @intelligent/web test:e2e
