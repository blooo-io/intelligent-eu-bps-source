# INT-176 / INT-99 / INT-177 / INT-178 — Trivy + module images after merge to
# develop. Not on pull_request. Failures fail this workflow (no continue-on-error).
#
# Images are pushed as :<sha> (provenance) and :develop (floating tag for Argo).
# develop branch protection blocks bot commits, so we do not pin the SHA in Git.
name: supply-chain

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  supply-chain:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan dependencies for vulnerabilities and excluded licences
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/aquasecurity/trivy:0.75.0 \
            fs --config /work/trivy.yaml --exit-code 1 /work
      - name: Build, scan and push module images
        env:
          IMAGE_PUSH: "true"
          IMAGE_FLOATING_TAG: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/module-images.mjs --build
