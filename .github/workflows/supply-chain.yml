# INT-176 / INT-99 / INT-177 / INT-178 / INT-183 — Trivy + module images after
# merge to develop. Not on pull_request. Failures fail this workflow (no
# continue-on-error).
#
# Images are pushed as :<sha> (provenance) and :develop (floating tag for Argo).
# develop branch protection blocks bot commits, so we do not pin the SHA in Git.
#
# INT-183: only rebuild images whose module trees (or shared inputs) changed
# between github.event.before and github.sha. Docs/deploy/contracts-only pushes
# skip the image build; lockfile / packages / config still rebuild all.
# INT-318: when before is 000…0, module-images.mjs falls back to HEAD^ so a
# scripts-only tip does not rebuild and push every module image.
# INT-321: workflow_dispatch + force_all_images republishes every module to the
# current GHCR path (needed after a chart image.repository rename).
name: supply-chain

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_all_images:
        description: "Rebuild and push every module image (ignore path diff)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  supply-chain:
    # head_commit is null on workflow_dispatch — treat missing message as allow.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the previous develop tip so IMAGE_DIFF_BASE is reachable.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Scan dependencies for vulnerabilities and excluded licences
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/aquasecurity/trivy:0.75.0 \
            fs --config /work/trivy.yaml --exit-code 1 /work
      - name: Build, scan and push changed module images
        env:
          IMAGE_PUSH: "true"
          IMAGE_FLOATING_TAG: develop
          # Push events stay selective (INT-183). Manual dispatch with
          # force_all_images=true clears IMAGE_CHANGED_ONLY for a full republish.
          IMAGE_CHANGED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all_images && 'false' || 'true' }}
          IMAGE_DIFF_BASE: ${{ github.event.before }}
          IMAGE_DIFF_HEAD: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/module-images.mjs --build
