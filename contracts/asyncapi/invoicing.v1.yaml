asyncapi: 3.0.0
info:
  title: invoicing events
  version: 1.0.0
  description: >-
    Domain events published by AC-06. Catalogue in application architecture section 4.
    Delivery is at least once. Consumers deduplicate on eventId. Payloads carry identifiers only.
  license:
    name: Apache-2.0
defaultContentType: application/json
channels:
  InvoiceIssued:
    address: InvoiceIssued
    description: Consumed by AC-07, AC-08, AC-09, AC-10 and AC-11.
    messages:
      InvoiceIssued:
        $ref: '#/components/messages/InvoiceIssued'
  InvoiceStatusChanged:
    address: InvoiceStatusChanged
    description: Consumed by AC-08, AC-09 and AC-10.
    messages:
      InvoiceStatusChanged:
        $ref: '#/components/messages/InvoiceStatusChanged'
  ErasureCompleted:
    address: ErasureCompleted
    description: Consumed by AC-12.
    messages:
      ErasureCompleted:
        $ref: '#/components/messages/ErasureCompleted'
operations:
  publishInvoiceIssued:
    action: send
    channel:
      $ref: '#/channels/InvoiceIssued'
    messages:
      - $ref: '#/channels/InvoiceIssued/messages/InvoiceIssued'
  publishInvoiceStatusChanged:
    action: send
    channel:
      $ref: '#/channels/InvoiceStatusChanged'
    messages:
      - $ref: '#/channels/InvoiceStatusChanged/messages/InvoiceStatusChanged'
  publishErasureCompleted:
    action: send
    channel:
      $ref: '#/channels/ErasureCompleted'
    messages:
      - $ref: '#/channels/ErasureCompleted/messages/ErasureCompleted'
components:
  messages:
    InvoiceIssued:
      name: InvoiceIssued
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: InvoiceIssued
              producer:
                const: AC-06
              data:
                type: object
                additionalProperties: false
                required:
                  - invoiceId
                  - issuerId
                  - recipientId
                  - settlementId
                  - dueDate
                  - billingPeriodFrom
                  - billingPeriodUntil
                  - settlementType
                  - totalEnergyKWh
                  - vatRate
                  - carriedForwardAmount
                  - amounts
                  - currency
                  - tradeIds
                properties:
                  invoiceId:
                    type: "string"
                    format: "uuid"
                  issuerId:
                    type: "string"
                    format: "uuid"
                    description: "Producer participant id. Not a name."
                  recipientId:
                    type: "string"
                    format: "uuid"
                    description: "Consumer participant id. Not a name."
                  settlementId:
                    type: "string"
                    format: "uuid"
                    description: >
                      Pair settlement this invoice was issued from. AC-10
                      publishes it as billingId (NFR-004). V1 has no separate
                      Billing row; the settlement is that record.
                  dueDate:
                    type: "string"
                    format: "date"
                    description: "Payment due date (YYYY-MM-DD)."
                  billingPeriodFrom:
                    type: "string"
                    format: "date-time"
                    description: "Inclusive start of the billed period (UTC)."
                  billingPeriodUntil:
                    type: "string"
                    format: "date-time"
                    description: "Exclusive end of the billed period (UTC)."
                  settlementType:
                    type: "string"
                    enum: ["periodic", "early", "final"]
                  totalEnergyKWh:
                    type: "string"
                    description: "Absolute net energy of the pair, three decimals (BR-08)."
                  vatRate:
                    type: "number"
                    minimum: 0
                    maximum: 1
                    description: "VAT fraction applied when the settlement was computed (BR-07)."
                  carriedForwardAmount:
                    type: "string"
                    pattern: "^-?\\d+\\.\\d{2}$"
                    description: >
                      Carry-forward brought into the invoice, oriented
                      consumer to producer (BR-05). AC-10 publishes the
                      absolute value; the topic field is unsigned.
                  exchangeRate:
                    description: >
                      Null when the invoice currency is EUR (no conversion).
                      Otherwise the ECB rate used by the settlement (BR-06).
                    oneOf:
                      - type: "null"
                      - type: "object"
                        additionalProperties: false
                        required: [rate, rateDate]
                        properties:
                          rate:
                            type: "string"
                          rateDate:
                            type: "string"
                            format: "date"
                  amounts:
                    type: "object"
                    additionalProperties: false
                    required:
                      - "energy"
                      - "vat"
                      - "total"
                    properties:
                      energy:
                        type: "string"
                        pattern: "^-?\\d+\\.\\d{2}$"
                        description: "Amount rounded to the cent (BR-08)."
                      vat:
                        type: "string"
                        pattern: "^-?\\d+\\.\\d{2}$"
                        description: "Amount rounded to the cent (BR-08)."
                      total:
                        type: "string"
                        pattern: "^-?\\d+\\.\\d{2}$"
                        description: "Amount rounded to the cent (BR-08)."
                  currency:
                    type: "string"
                    pattern: "^[A-Z]{3}$"
                  tradeIds:
                    type: "array"
                    items:
                      type: "string"
    InvoiceStatusChanged:
      name: InvoiceStatusChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: InvoiceStatusChanged
              producer:
                const: AC-06
              data:
                type: object
                additionalProperties: false
                required:
                  - invoiceId
                  - status
                  - outstanding
                properties:
                  invoiceId:
                    type: "string"
                    format: "uuid"
                  status:
                    type: "string"
                    enum:
                      - "Draft"
                      - "Open"
                      - "PartiallyPaid"
                      - "Paid"
                      - "Overdue"
                      - "Void"
                      - "Disputed"
                  reason:
                    type: "string"
                  outstanding:
                    type: "string"
                    pattern: "^-?\\d+\\.\\d{2}$"
                    description: "Amount rounded to the cent (BR-08)."
    ErasureCompleted:
      name: ErasureCompleted
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: ErasureCompleted
              producer:
                const: AC-06
              data:
                type: object
                additionalProperties: false
                required:
                  - requestId
                  - module
                  - result
                properties:
                  requestId:
                    type: "string"
                    format: "uuid"
                  module:
                    type: "string"
                    const: "AC-06"
                  result:
                    type: "string"
                    enum:
                      - "completed"
                      - "failed"
