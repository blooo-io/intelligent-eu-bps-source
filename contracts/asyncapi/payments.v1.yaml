asyncapi: 3.0.0
info:
  title: payments events
  version: 1.1.0
  description: >-
    Domain events published by AC-07. Catalogue in application architecture section 4.
    Delivery is at least once. Consumers deduplicate on eventId. Payloads carry identifiers only.
  license:
    name: Apache-2.0
defaultContentType: application/json
channels:
  PaymentAccountStatusChanged:
    address: PaymentAccountStatusChanged
    description: Consumed by AC-03.
    messages:
      PaymentAccountStatusChanged:
        $ref: '#/components/messages/PaymentAccountStatusChanged'
  PaymentStatusChanged:
    address: PaymentStatusChanged
    description: Consumed by AC-06, AC-08, AC-09, AC-10 and AC-11.
    messages:
      PaymentStatusChanged:
        $ref: '#/components/messages/PaymentStatusChanged'
  PayoutStatusChanged:
    address: PayoutStatusChanged
    description: Consumed by AC-09, AC-10 and AC-11.
    messages:
      PayoutStatusChanged:
        $ref: '#/components/messages/PayoutStatusChanged'
  ErasureCompleted:
    address: ErasureCompleted
    description: Consumed by AC-12.
    messages:
      ErasureCompleted:
        $ref: '#/components/messages/ErasureCompleted'
  KycStatusChanged:
    address: KycStatusChanged
    description: Consumed by AC-03, AC-06 and AC-09.
    messages:
      KycStatusChanged:
        $ref: '#/components/messages/KycStatusChanged'
operations:
  publishPaymentAccountStatusChanged:
    action: send
    channel:
      $ref: '#/channels/PaymentAccountStatusChanged'
    messages:
      - $ref: '#/channels/PaymentAccountStatusChanged/messages/PaymentAccountStatusChanged'
  publishPaymentStatusChanged:
    action: send
    channel:
      $ref: '#/channels/PaymentStatusChanged'
    messages:
      - $ref: '#/channels/PaymentStatusChanged/messages/PaymentStatusChanged'
  publishPayoutStatusChanged:
    action: send
    channel:
      $ref: '#/channels/PayoutStatusChanged'
    messages:
      - $ref: '#/channels/PayoutStatusChanged/messages/PayoutStatusChanged'
  publishErasureCompleted:
    action: send
    channel:
      $ref: '#/channels/ErasureCompleted'
    messages:
      - $ref: '#/channels/ErasureCompleted/messages/ErasureCompleted'
  publishKycStatusChanged:
    action: send
    channel:
      $ref: '#/channels/KycStatusChanged'
    messages:
      - $ref: '#/channels/KycStatusChanged/messages/KycStatusChanged'
components:
  messages:
    PaymentAccountStatusChanged:
      name: PaymentAccountStatusChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: PaymentAccountStatusChanged
              producer:
                const: AC-07
              data:
                type: object
                additionalProperties: false
                required:
                  - participantId
                  - kycStatus
                  - paymentMethodPresent
                properties:
                  participantId:
                    type: "string"
                    format: "uuid"
                  kycStatus:
                    type: "string"
                  paymentMethodPresent:
                    type: "boolean"
    PaymentStatusChanged:
      name: PaymentStatusChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: PaymentStatusChanged
              producer:
                const: AC-07
              data:
                type: object
                additionalProperties: false
                required:
                  - paymentId
                  - invoiceId
                  - status
                  - payerId
                  - payeeId
                  - amount
                  - currency
                  - initiatedAt
                properties:
                  paymentId:
                    type: "string"
                    format: "uuid"
                  invoiceId:
                    type: "string"
                    format: "uuid"
                  payerId:
                    type: "string"
                    format: "uuid"
                    description: "Consumer participant who pays. Not a name."
                  payeeId:
                    type: "string"
                    format: "uuid"
                    description: "Producer participant who is paid. Not a name."
                  status:
                    type: "string"
                    enum:
                      - "pending"
                      - "succeeded"
                      - "failed"
                      - "cancelled"
                      - "refunded"
                  amount:
                    type: "string"
                    pattern: "^-?\\d+\\.\\d{2}$"
                  currency:
                    type: "string"
                    pattern: "^[A-Z]{3}$"
                  initiatedAt:
                    type: "string"
                    format: "date-time"
                  settledAt:
                    type: "string"
                    format: "date-time"
                  failureCategory:
                    type: "string"
                    enum:
                      - card_declined
                      - insufficient_funds
                      - authentication_required
                      - mandate_invalid
                      - bank_account_invalid
                      - provider_error
                      - other
                    description: Cause of a failed payment (REQ-046 / KPI UE-3).
                  method:
                    type: "string"
                    enum: [card, sepa_debit]
                    description: Payment method used (REQ-046 / KPI TE-2).
                  processingTimeMs:
                    type: integer
                    minimum: 0
                    description: End-to-end processing time in milliseconds (REQ-046 / KPI TE-2).
                  feeAmount:
                    type: "string"
                    pattern: "^-?\\d+\\.\\d{2}$"
                  feeCurrency:
                    type: "string"
                    pattern: "^[A-Z]{3}$"
    KycStatusChanged:
      name: KycStatusChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: KycStatusChanged
              producer:
                const: AC-07
              data:
                type: object
                additionalProperties: false
                required:
                  - subjectId
                  - subjectType
                  - kycStatus
                  - kycVerified
                  - method
                  - payoutAccountVerified
                properties:
                  subjectId:
                    type: "string"
                    format: "uuid"
                  subjectType:
                    type: "string"
                    enum: [participant, manager]
                  kycStatus:
                    type: "string"
                    enum: [none, pending, verified, rejected]
                  kycVerified:
                    type: "boolean"
                  method:
                    type: "string"
                    enum: [connect_onboarding, identity_document]
                  payoutAccountVerified:
                    type: "boolean"
    PayoutStatusChanged:
      name: PayoutStatusChanged
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: PayoutStatusChanged
              producer:
                const: AC-07
              data:
                type: object
                additionalProperties: false
                required:
                  - payoutId
                  - participantId
                  - period
                  - amount
                  - currency
                  - status
                properties:
                  payoutId:
                    type: "string"
                    format: "uuid"
                  participantId:
                    type: "string"
                    format: "uuid"
                  period:
                    type: "string"
                  amount:
                    type: "string"
                    pattern: "^-?\\d+\\.\\d{2}$"
                  currency:
                    type: "string"
                    pattern: "^[A-Z]{3}$"
                  status:
                    type: "string"
                    enum:
                      - "requested"
                      - "in_transit"
                      - "paid"
                      - "failed"
                      - "canceled"
                  failureCategory:
                    type: "string"
    ErasureCompleted:
      name: ErasureCompleted
      contentType: application/json
      payload:
        allOf:
          - $ref: ./components/envelope.schema.json
          - type: object
            properties:
              type:
                const: ErasureCompleted
              producer:
                const: AC-07
              data:
                type: object
                additionalProperties: false
                required:
                  - requestId
                  - module
                  - result
                properties:
                  requestId:
                    type: "string"
                    format: "uuid"
                  module:
                    type: "string"
                    const: "AC-07"
                  result:
                    type: "string"
                    enum:
                      - "completed"
                      - "failed"
