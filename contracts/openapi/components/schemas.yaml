openapi: 3.1.0
info:
  title: Shared V1 schemas
  version: 1.0.0
  description: >
    Schemas shared by internal OpenAPI contracts (INT-455). Field names come from
    the validated logical data model (02 §6) and the API catalogue (03 §3).
    This document is not an API.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    Uuid:
      type: string
      format: uuid
    Currency:
      type: string
      description: ISO 4217 currency code of the community.
      pattern: '^[A-Z]{3}$'
      examples: ['EUR']
    Money:
      type: string
      description: Decimal amount rounded to the cent (BR-08).
      pattern: '^-?\d+\.\d{2}$'
      examples: ['5.00']
    UnitPrice:
      type: string
      description: Energy price per kWh in EUR (REQ-004).
      pattern: '^\d+\.\d{2,6}$'
      examples: ['0.120000']
    InvoiceAmounts:
      type: object
      additionalProperties: false
      required: [energy, gridFee, levy, tax, vat, total]
      properties:
        energy:
          $ref: '#/components/schemas/Money'
        gridFee:
          $ref: '#/components/schemas/Money'
        levy:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        vat:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'

    InvoiceTradeLine:
      type: object
      additionalProperties: false
      required: [tradeId, role, kWh, pricePerKWh, amount]
      description: >
        REQ-007 — one trade covered by the invoice. kWh and amount are signed
        in the invoice direction (a purchase is positive). Grid-fee components
        are on the invoice totals (REQ-004), not duplicated per line.
      properties:
        tradeId:
          type: string
        role:
          type: string
          enum: [buyer, seller]
        deliveryStart:
          type: string
          format: date-time
          description: Start of the delivery period (BR-02).
        deliveryEnd:
          type: string
          format: date-time
          description: End of the delivery period (BR-02).
        kWh:
          type: string
          description: Signed energy, three decimals (BR-08).
          pattern: '^-?\d+\.\d{3}$'
        pricePerKWh:
          $ref: '#/components/schemas/UnitPrice'
        adjustedPricePerKWh:
          $ref: '#/components/schemas/UnitPrice'
        amount:
          $ref: '#/components/schemas/Money'
    Rate:
      type: string
      description: Decimal rate rounded to the cent, such as a VAT rate (BR-07, BR-08).
      pattern: '^\d+\.\d{2}$'
      examples: ['0.00']
    FxRate:
      type: string
      description: >
        ECB reference rate EUR → community currency, kept with 4 to 6 decimals
        and shown on the invoice (BR-06, REQ-002). 1.0000 for EUR communities.
      pattern: '^\d+\.\d{4,6}$'
      examples: ['0.9412']
    BillingPeriod:
      type: string
      description: >
        Billing period of the community calendar, YYYY-MM (monthly) or YYYY-Qn
        (quarterly) (REQ-006).
      pattern: '^\d{4}-(0[1-9]|1[0-2]|Q[1-4])$'
      examples: ['2026-11', '2026-Q4']
    RateDate:
      type: string
      format: date
      description: >
        Date of the ECB reference rate applied: last TARGET business day of the
        period, or the settlement date for final runs (BR-06, REQ-002).
    BillingMode:
      type: string
      description: Community billing mode (REQ-043). V1 communities are virtual.
      enum: [live, virtual]
    ParticipantRole:
      type: string
      description: Role of a participant in the community (02 §6).
      enum: [consumer, producer, prosumer]
    CallerRole:
      type: string
      description: Role of the authenticated caller on the public API (03 §3.1).
      enum: [member, manager, operator, dpo]
    ReadinessStatus:
      type: string
      description: Participant readiness lifecycle (02 §5).
      enum: [Invited, ProfileCompleted, TermsAccepted, Ready, Restricted, Offboarded]
    InvoiceStatus:
      type: string
      description: Invoice lifecycle (REQ-044, 02 §5).
      enum: [Draft, Open, PartiallyPaid, Paid, Overdue, Void, Disputed]
    StatementStatus:
      type: string
      description: >
        Participant billing statement lifecycle (REQ-059). Ontology billingStatus
        without Disputed.
      enum: [Open, PartiallyPaid, Paid, Overdue, Void]
    PaymentStatus:
      type: string
      description: Payment lifecycle (02 §5). `requires_action` waits for the payer on a PSP-hosted checkout (A7-bis).
      enum: [pending, requires_action, succeeded, failed, cancelled, refunded]
    PayoutStatus:
      type: string
      description: Connect payout lifecycle (REQ-015, REQ-060).
      enum: [requested, in_transit, paid, failed, canceled]
    BillingRunType:
      type: string
      description: Kind of billing run (02 §6). Early settlement removed (REQ-057 deprecated).
      enum: [periodic, final]
    BillingRunStatus:
      type: string
      description: Billing run lifecycle (02 §5).
      enum: [Scheduled, Collecting, Computing, Completed, Failed]
    PspHandoffHosted:
      type: object
      additionalProperties: false
      description: A7-bis — redirect to Stripe-hosted UI (checkout, connect, verify).
      required: [surface, provider, purpose, url, expiresAt]
      properties:
        surface:
          const: hosted
        provider:
          const: stripe
        purpose:
          type: string
          enum: [checkout, setup, connect_onboarding, identity]
        url:
          type: string
          pattern: '^https://(checkout|connect|verify)\.stripe\.com/'
        expiresAt:
          type: string
          format: date-time
    PspHandoffEmbedded:
      type: object
      additionalProperties: false
      description: A7-bis — Stripe.js / Connect embedded components (no Blooo URL).
      required: [surface, provider, purpose, publishableKey, clientSecret, expiresAt]
      properties:
        surface:
          const: embedded
        provider:
          const: stripe
        purpose:
          type: string
          enum: [payment, setup, connect_onboarding, identity]
        publishableKey:
          type: string
          pattern: '^pk_(test|live)_'
        clientSecret:
          type: string
          minLength: 8
        connectedAccountRef:
          type: string
          pattern: '^acct_'
          description: Stripe Connect account for direct charges (Payment Element).
        expiresAt:
          type: string
          format: date-time
    PspHandoff:
      description: Stripe UI handoff for payment, setup, Connect onboarding or Identity (A7-bis).
      oneOf:
        - $ref: '#/components/schemas/PspHandoffHosted'
        - $ref: '#/components/schemas/PspHandoffEmbedded'
    ActorAuthorization:
      type: object
      additionalProperties: false
      required: [actorId, status, memberships]
      properties:
        actorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, offboarded, unknown]
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [communityId, role]
            properties:
              communityId:
                $ref: '#/components/schemas/Uuid'
              role:
                type: string
                enum: [member, manager, operator]
              participantRole:
                $ref: '#/components/schemas/ParticipantRole'
    JobName:
      type: string
      description: Scheduled job owned by a module (02 §4.5).
      enum:
        - RefreshIntake
        - CheckIntakeHealth
        - StartRun
        - MarkOverdue
        - Reconcile
        - BuildReport
        - ExportKpi
        - RetryPending
        - PurgeCache
        - ApplyRetention
        - FetchRates
        - RunAutoPayouts
        - SendReminders
    Problem:
      type: object
      additionalProperties: false
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    BadRequest:
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller is not allowed to see this participant or community (REQ-010).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist in the caller's scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token validated by the API gateway (TD-8).
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak client-credentials token of the calling module, validated by the
        module guard (04 §7). Internal APIs are not exposed at the gateway.
