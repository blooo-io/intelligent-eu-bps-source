openapi: 3.1.0
info:
  title: Compliance internal API
  version: 1.0.0
  description: >
    Module-to-module commands of AC-12 (02 §4.5). Never exposed to clients.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /internal/v1
tags:
  - name: Compliance
    description: Module-to-module commands of AC-12.
security:
  - serviceAuth: []
paths:
  /retention:apply:
    post:
      operationId: applyRetention
      tags: [Compliance]
      summary: Apply personal-data retention
      description: ApplyRetention. Called by AC-14 (REQ-011).
      responses:
        '202':
          description: Retention run accepted.
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /retention-policy:
    get:
      operationId: getRetentionPolicy
      tags: [Compliance]
      summary: Current retention policy
      description: >
        REQ-011 / Task 3.23 — explicit personal, invoice and KYC-log retention
        periods configured for this deployment.
      responses:
        '200':
          description: Retention policy in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
components:
  schemas:
    RetentionPolicy:
      type: object
      additionalProperties: false
      required:
        - personalRetentionDays
        - invoiceRetentionYears
        - kycLogRetentionYears
      properties:
        personalRetentionDays:
          type: integer
          minimum: 1
          description: Days after relationship end before personal cache is anonymized.
        invoiceRetentionYears:
          type: integer
          minimum: 6
          maximum: 10
          description: Legal invoice retention (CH/FR/ES/PT range).
        kycLogRetentionYears:
          type: integer
          minimum: 5
          description: KYC audit-log retention (at least 5 years).
  securitySchemes:
    serviceAuth:
      $ref: '../components/schemas.yaml#/components/securitySchemes/serviceAuth'
