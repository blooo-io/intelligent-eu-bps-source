openapi: 3.1.0
info:
  title: Invoicing internal API
  version: 2.1.0
  description: >
    Module-to-module commands of AC-06 (03 §3.2 and 02 §4.5). Never exposed to clients.
    Billing owns invoice numbering, PDF storage and reminders (REQ-039, REQ-042).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /internal/v1
tags:
  - name: Invoicing
    description: Module-to-module commands of AC-06.
security:
  - serviceAuth: []
paths:
  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags: [Invoicing]
      summary: Read one invoice
      description: GetInvoice(invoiceId). Called by AC-07. Identifiers and amounts only.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalInvoice'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /invoices/{invoiceId}/document:
    get:
      operationId: getInvoiceDocumentInternal
      tags: [Invoicing]
      summary: Read stored invoice PDF
      description: GetInvoiceDocument(invoiceId). Called by AC-11 and AC-07 (REQ-039).
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Invoice PDF generated and stored at issue time.
          headers:
            X-Legal-Number:
              schema:
                type: string
              description: Billing-assigned legal number (REQ-042).
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
                contentEncoding: binary
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /invoices:send-reminders:
    post:
      operationId: sendInvoiceReminders
      tags: [Invoicing]
      summary: Send scheduled payment reminders
      description: SendReminders(asOf). Called by AC-14 (REQ-061).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asOf]
              properties:
                asOf:
                  type: string
                  format: date
      responses:
        '202':
          description: Reminder batch accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, sent]
                properties:
                  accepted:
                    type: boolean
                  sent:
                    type: integer
                    minimum: 0
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /invoices:mark-overdue:
    post:
      operationId: markOverdue
      tags: [Invoicing]
      summary: Mark overdue invoices
      description: MarkOverdue(asOf). Called by AC-14 (REQ-044).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asOf]
              properties:
                asOf:
                  type: string
                  format: date
      responses:
        '202':
          description: Overdue check accepted.
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /invoices:by-settlement/{settlementId}:
    get:
      operationId: getInvoiceBySettlement
      tags: [Invoicing]
      summary: Read invoice by pair settlement id
      description: >
        INT-238 — poll for the invoice created by the SettlementCompleted
        NATS consumer (or the operator bridge). Idempotent lookup on
        settlementId; identifiers and amounts only.
      parameters:
        - name: settlementId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: The invoice for this pair settlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalInvoice'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /invoices:from-settlement:
    post:
      operationId: createInvoiceFromSettlement
      tags: [Invoicing]
      summary: Create invoice from pair settlement
      description: >
        INT-196 / UAT-028 — map AC-05 pair settlement to a self-billing invoice
        (REQ-039). Idempotent on settlementId. Operator / seed bridge; primary
        path is SettlementCompleted via NATS (INT-223 / INT-238).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairSettlementInput'
      responses:
        '201':
          description: Invoice created (or existing idempotent row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCreated'
        '200':
          description: Zero-amount settlement skipped (BR-05 carry-forward).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [skipped, settlementId]
                properties:
                  skipped:
                    type: boolean
                  settlementId:
                    $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                  reason:
                    type: string
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /participants/{participantId}/invoices:
    get:
      operationId: listParticipantInvoices
      tags: [Invoicing]
      summary: Invoices where the participant is issuer or addressee
      description: REQ-013 — DSAR export (Task 3.19).
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Invoice summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceSummary'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /statements:
    get:
      operationId: listStatements
      tags: [Invoicing]
      summary: List participant statements
      description: >
        ListStatements(participantId, period?). Called by AC-09 and operator
        tools (REQ-059). Identifiers and amounts only.
      parameters:
        - name: participantId
          in: query
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        - name: period
          in: query
          required: false
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/BillingPeriod'
      responses:
        '200':
          description: Statements for the participant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalStatement'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../components/schemas.yaml#/components/responses/Unauthorized'
  /invoices/{invoiceId}/reminders:
    post:
      operationId: sendInvoiceReminder
      tags: [Invoicing]
      summary: Send a payment reminder for one invoice (EWDS sendReminder / REQ-061)
      description: >
        INT-461 — records the reminder on the invoice and emits
        PaymentReminderRequested for AC-11. Open | Overdue | PartiallyPaid only.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId, communityId]
              properties:
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                communityId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                trigger:
                  type: string
                  enum: [manual, scheduled]
                  default: manual
      responses:
        '200':
          description: Reminder recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invoiceId, reminderCount]
                properties:
                  invoiceId:
                    $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                  reminderCount:
                    type: integer
                    minimum: 1
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
        '409':
          $ref: '../components/schemas.yaml#/components/responses/Conflict'
  /invoices/{invoiceId}/status:
    post:
      operationId: setInvoiceStatusInternal
      tags: [Invoicing]
      summary: Change invoice status (EWDS setInvoiceStatus target)
      description: >
        REQ-044 — manager-initiated status change with mandatory reason.
        Called by AC-10 command dispatcher on behalf of an authorized actor.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason, actorId, communityId]
              properties:
                status:
                  $ref: '../components/schemas.yaml#/components/schemas/InvoiceStatus'
                reason:
                  type: string
                  minLength: 3
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                communityId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Updated invoice (identifiers and status).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invoiceId, invoiceStatus]
                properties:
                  invoiceId:
                    $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                  invoiceStatus:
                    $ref: '../components/schemas.yaml#/components/schemas/InvoiceStatus'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    serviceAuth:
      $ref: '../components/schemas.yaml#/components/securitySchemes/serviceAuth'
  schemas:
    InternalInvoice:
      type: object
      additionalProperties: false
      required:
        - invoiceId
        - producerId
        - consumerId
        - communityId
        - currency
        - status
        - legalNumber
        - dueDate
        - amounts
        - total
        - tradeIds
        - pairSettlementId
      properties:
        invoiceId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        producerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        consumerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        communityId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        currency:
          $ref: '../components/schemas.yaml#/components/schemas/Currency'
        status:
          $ref: '../components/schemas.yaml#/components/schemas/InvoiceStatus'
        legalNumber:
          type: string
          description: Billing-assigned legal number (REQ-042).
        dueDate:
          type: string
          format: date
        amounts:
          $ref: '../components/schemas.yaml#/components/schemas/InvoiceAmounts'
        total:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        tradeIds:
          type: array
          items:
            type: string
        pairSettlementId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
    StatementInvoice:
      type: object
      additionalProperties: false
      required: [invoiceId, producerId, consumerId, total, status]
      properties:
        invoiceId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        producerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        consumerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        total:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        status:
          $ref: '../components/schemas.yaml#/components/schemas/InvoiceStatus'
    InternalStatement:
      type: object
      additionalProperties: false
      required:
        - statementId
        - participantId
        - communityId
        - period
        - periodFrom
        - periodUntil
        - totalBought
        - totalSold
        - netBalance
        - direction
        - currency
        - invoiceIds
        - status
        - revision
        - invoices
      properties:
        statementId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        participantId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        communityId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        period:
          $ref: '../components/schemas.yaml#/components/schemas/BillingPeriod'
        periodFrom:
          type: string
          format: date-time
        periodUntil:
          type: string
          format: date-time
        totalBought:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        totalSold:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        netBalance:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        direction:
          type: string
          enum: [to_pay, to_receive, balanced]
        currency:
          $ref: '../components/schemas.yaml#/components/schemas/Currency'
        invoiceIds:
          type: array
          items:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        status:
          $ref: '../components/schemas.yaml#/components/schemas/StatementStatus'
        revision:
          type: integer
          minimum: 1
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/StatementInvoice'
    PairSettlementInput:
      type: object
      additionalProperties: false
      required:
        - settlementId
        - runId
        - consumerId
        - producerId
        - communityId
        - tradeIds
        - kWh
        - energyAmount
        - vat
        - currency
        - rate
        - gridFeeAmount
        - levyAmount
        - taxAmount
        - tariffId
      properties:
        settlementId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        runId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        consumerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        producerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        communityId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        tradeIds:
          type: array
          items:
            type: string

        lines:
          type: array
          description: >
            REQ-007 — one entry per trade (delivery period, kWh, price per kWh,
            amount). Empty when the invoice settles a carried balance only.
          items:
            $ref: '../components/schemas.yaml#/components/schemas/InvoiceTradeLine'
        kWh:
          type: string
        energyAmount:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        vat:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        gridFeeAmount:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        levyAmount:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        taxAmount:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        tariffId:
          oneOf:
            - type: string
            - type: 'null'
        currency:
          $ref: '../components/schemas.yaml#/components/schemas/Currency'
        rate:
          $ref: '../components/schemas.yaml#/components/schemas/FxRate'
        rateDate:
          $ref: '../components/schemas.yaml#/components/schemas/RateDate'
    InvoiceCreated:
      type: object
      additionalProperties: false
      required: [invoiceId, producerId, consumerId, currency, status, total, tradeIds, pairSettlementId]
      properties:
        invoiceId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        producerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        consumerId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        currency:
          $ref: '../components/schemas.yaml#/components/schemas/Currency'
        status:
          $ref: '../components/schemas.yaml#/components/schemas/InvoiceStatus'
        total:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        tradeIds:
          type: array
          items:
            type: string
        pairSettlementId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        legalNumber:
          type: string
          description: Billing-assigned legal number when issued (REQ-042).
    InvoiceSummary:
      type: object
      additionalProperties: false
      required:
        - invoiceId
        - period
        - partyRole
        - total
        - currency
        - status
      properties:
        invoiceId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        legalNumber:
          oneOf:
            - type: string
            - type: 'null'
        period:
          type: string
        partyRole:
          type: string
          enum: [issuer, addressee]
        total:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        currency:
          $ref: '../components/schemas.yaml#/components/schemas/Currency'
        status:
          type: string
        issuedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
