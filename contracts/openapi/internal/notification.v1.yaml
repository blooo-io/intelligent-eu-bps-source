openapi: 3.1.0
info:
  title: Notification internal API
  version: 1.0.0
  description: >
    Module-to-module commands of AC-11 (03 §3.2). Never exposed to clients.
    INT-462 — REQ-061 sendReminder is owned by AC-06
    (`POST /internal/v1/invoices/{invoiceId}/reminders`); AC-11 consumes
    PaymentReminderRequested and delivers mail. The former `/reminders`
    path is removed (was never implemented; 404 on destinDev).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /internal/v1
tags:
  - name: Notification
    description: Module-to-module commands of AC-11.
security:
  - serviceAuth: []
paths: {}
components:
  securitySchemes:
    serviceAuth:
      $ref: '../components/schemas.yaml#/components/securitySchemes/serviceAuth'
