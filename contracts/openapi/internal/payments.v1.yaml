openapi: 3.1.0
info:
  title: Payments internal API
  version: 1.1.0
  description: >
    Module-to-module commands of AC-07 (03 §3.2). Never exposed to clients.
    Stripe Connect is master of producer accounts (TP-7); callers must not invent
    synthetic acct_test_* ids when PSP_PROVIDER=stripe (INT-228).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /internal/v1
tags:
  - name: Payments
    description: Module-to-module commands of AC-07.
security:
  - serviceAuth: []
paths:
  /payments/{paymentId}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Read a payment recorded by AC-07
      description: >
        INT-338 / TP-7 — authoritative payment status. AC-06 confirms
        PaymentStatusChanged against this read before marking an invoice Paid.
        The event body is not trusted on its own.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Payment recorded by AC-07.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /payment-accounts/{participantId}:
    get:
      operationId: getPaymentAccount
      tags: [Payments]
      summary: Read payment-account binding for a participant
      description: >
        GetPaymentAccount(participantId). Called by AC-06 before creating a
        self-billing Stripe invoice. Returns the Connect account id owned by
        Stripe when the producer has completed (or been provisioned for) KYC.
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Payment-account binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /payouts:run-auto:
    post:
      operationId: runAutoPayouts
      tags: [Payments]
      summary: Run automatic community payouts
      description: >
        Enqueues payout requests for producers in a community with autoPayout
        enabled (REQ-015). Called by AC-14 RunAutoPayouts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [communityId]
              properties:
                communityId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '202':
          description: Auto-payout run accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [requested, blocked, nearHoldingLimit]
                properties:
                  requested:
                    type: integer
                    minimum: 0
                    description: Payouts enqueued.
                  blocked:
                    type: integer
                    minimum: 0
                    description: Producer periods skipped (prerequisites not met or refused by the PSP).
                  nearHoldingLimit:
                    type: array
                    description: >
                      Participants whose oldest succeeded payment not yet paid out is at
                      least 75 days old (the PSP holds manual-payout funds at most 90 days).
                    items:
                      $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /payment-accounts:provision:
    post:
      operationId: provisionPaymentAccount
      tags: [Payments]
      summary: Provision a fresh Stripe Connect (or consumer) binding
      description: >
        INT-228 — create a **new** Stripe test-mode Connect Custom account for a
        producer (with INT-195 magic KYC values so charges_enabled becomes true),
        bind it in AC-07, and return the real acct_ id. Set fresh=true to always
        create a new Stripe account even if one is already bound (each seed/run
        must leave visible artifacts in the Stripe Dashboard).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participantId, communityId, role]
              properties:
                participantId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                communityId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                role:
                  type: string
                  enum: [producer, consumer, prosumer]
                fresh:
                  type: boolean
                  description: When true, always create a new Stripe entity.
                  default: true
      responses:
        '201':
          description: Provisioned (new Stripe entity created or rebound).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '200':
          description: Existing binding reused (fresh=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /payments:start:
    post:
      operationId: startPayment
      tags: [Payments]
      summary: Start paying an open invoice (EWDS startPayment target)
      description: >
        REQ-052 / REQ-014 / A7-bis — create or resume a payment for an invoice.
        Returns payment status and an optional PspHandoff when authentication or
        payment-method entry is required (hosted URL or embedded clientSecret).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invoiceId, actorId, surface]
              properties:
                invoiceId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                surface:
                  type: string
                  enum: [hosted, embedded]
                  default: hosted
                returnUrl:
                  type: string
                  format: uri
                  description: Required when surface is hosted (Checkout return).
      responses:
        '200':
          description: Payment started or completed off-session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [paymentId, status]
                properties:
                  paymentId:
                    $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                  status:
                    type: string
                    enum: [succeeded, processing, requires_action]
                  handoff:
                    $ref: '../components/schemas.yaml#/components/schemas/PspHandoff'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /payouts:request:
    post:
      operationId: requestWithdrawal
      tags: [Payments]
      summary: Request a producer payout for the open period (EWDS requestWithdrawal)
      description: REQ-015 — manual or policy-driven withdrawal after producer invoices are paid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId, currency]
              properties:
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                currency:
                  $ref: '../components/schemas.yaml#/components/schemas/Currency'
      responses:
        '200':
          description: Payout recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [payoutId, payoutStatus, amount, currency]
                properties:
                  payoutId:
                    $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                  payoutStatus:
                    type: string
                  amount:
                    $ref: '../components/schemas.yaml#/components/schemas/Money'
                  currency:
                    $ref: '../components/schemas.yaml#/components/schemas/Currency'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
        '409':
          description: Prerequisites not met (e.g. unpaid producer invoices).
          content:
            application/problem+json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/Problem'
  /kyc:start:
    post:
      operationId: startKyc
      tags: [Payments]
      summary: Start Connect or Identity verification (EWDS startKyc target)
      description: >
        REQ-051 / A7-bis — returns a PspHandoff for Connect onboarding
        (connect_account) or Stripe Identity (identity).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId, kind, surface]
              properties:
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                kind:
                  type: string
                  enum: [connect_account, identity]
                surface:
                  type: string
                  enum: [hosted, embedded]
                  default: hosted
                returnUrl:
                  type: string
                  format: uri
                refreshUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Verification session created.
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/components/schemas/PspHandoff'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /payment-methods:setup:
    post:
      operationId: setupPaymentMethod
      tags: [Payments]
      summary: Start saving a card or SEPA mandate (EWDS setupPaymentMethod)
      description: >
        REQ-014 / A7-bis — returns a PspHandoff for SetupIntent (embedded) or
        hosted Checkout in setup mode so the project UI can collect a payment
        method without a Blooo URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorId, surface]
              properties:
                actorId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                surface:
                  type: string
                  enum: [hosted, embedded]
                  default: hosted
                returnUrl:
                  type: string
                  format: uri
                  description: Required when surface is hosted.
      responses:
        '200':
          description: Setup session created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [handoff]
                properties:
                  handoff:
                    $ref: '../components/schemas.yaml#/components/schemas/PspHandoff'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /kyc-status/{subjectId}:
    get:
      operationId: getKycStatus
      tags: [Payments]
      summary: Read KYC status for a subject
      description: REQ-045 / REQ-051 — used by AC-03 and compliance export.
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: KYC status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatus'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /psp/capabilities:
    get:
      operationId: getPspCapabilities
      tags: [Payments]
      summary: Whether test and live PSP keys are configured
      description: REQ-043 — checked before switching billingMode to live.
      responses:
        '200':
          description: PSP capability flags.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider, testConfigured, liveConfigured]
                properties:
                  provider:
                    type: string
                    enum: [stripe, mock]
                  testConfigured:
                    type: boolean
                  liveConfigured:
                    type: boolean
  /payment-accounts/{participantId}/personal-data:
    get:
      operationId: getPaymentAccountPersonalData
      tags: [Payments]
      summary: Payment-account personal data for DSAR
      description: REQ-013 — service-only (Task 3.18).
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Payment-account personal data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountPersonalData'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /payment-accounts/{participantId}:erase-at-psp:
    post:
      operationId: erasePaymentAccountAtPsp
      tags: [Payments]
      summary: Erase payment data at the PSP
      description: REQ-013 — deletes customers; Connect account in test mode only.
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Erasure outcome.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [outcome]
                properties:
                  outcome:
                    type: string
                    enum: [erased, retained_by_psp, nothing_to_erase]
                  reason:
                    type: string
                    enum: [aml_legal_obligation]
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
components:
  schemas:
    PaymentStatus:
      type: object
      additionalProperties: false
      required: [paymentId, invoiceId, status]
      properties:
        paymentId:
          type: string
        invoiceId:
          type: string
        status:
          type: string
          description: AC-07 payment status (succeeded, failed, pending, …).
    PaymentAccount:
      type: object
      additionalProperties: false
      required: [participantId, role, communityId, kycStatus]
      properties:
        participantId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        pspAccountRef:
          type: [string, "null"]
          description: PSP Connect account reference when role is producer/prosumer.
        paymentMethodId:
          type: [string, "null"]
          description: Consumer payment method id when present.
        kycStatus:
          type: string
        role:
          type: string
          enum: [producer, consumer, prosumer]
        communityId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        chargesEnabled:
          type: boolean
          description: PSP charges enabled when known (producer).
    KycStatus:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - subjectType
        - kycStatus
        - kycVerified
        - method
        - updatedAt
        - payoutAccountVerified
      properties:
        subjectId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        subjectType:
          type: string
          enum: [participant, manager]
        kycStatus:
          type: string
          enum: [none, pending, verified, rejected]
        kycVerified:
          type: boolean
        method:
          type: string
          enum: [connect_onboarding, identity_document]
        updatedAt:
          type: string
          format: date-time
        payoutAccountVerified:
          type: boolean
    PaymentAccountPersonalData:
      type: object
      additionalProperties: false
      required:
        - participantId
        - pspAccountRef
        - paymentMethodPresent
        - kycStatus
        - kycVerified
        - payoutAccountVerified
        - kycLog
      properties:
        participantId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        pspAccountRef:
          oneOf:
            - type: string
            - type: 'null'
        paymentMethodPresent:
          type: boolean
        kycStatus:
          type: string
          enum: [none, pending, verified, rejected]
        kycVerified:
          type: boolean
        kycVerifiedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        payoutAccountVerified:
          type: boolean
        kycLog:
          type: array
          items:
            type: object
            additionalProperties: true
  securitySchemes:
    serviceAuth:
      $ref: '../components/schemas.yaml#/components/securitySchemes/serviceAuth'
