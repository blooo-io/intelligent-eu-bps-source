openapi: 3.1.0
info:
  title: Payments internal API
  version: 1.0.0
  description: >
    Module-to-module commands of AC-07 (03 §3.2). Never exposed to clients.
    Stripe Connect is master of producer accounts (TP-7); callers must not invent
    synthetic acct_test_* ids when PSP_PROVIDER=stripe (INT-228).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /internal/v1
tags:
  - name: Payments
    description: Module-to-module commands of AC-07.
security:
  - serviceAuth: []
paths:
  /payments/{paymentId}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Read a payment recorded by AC-07
      description: >
        INT-338 / TP-7 — authoritative payment status. AC-06 confirms
        PaymentStatusChanged against this read before marking an invoice Paid.
        The event body is not trusted on its own.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Payment recorded by AC-07.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /payment-accounts/{participantId}:
    get:
      operationId: getPaymentAccount
      tags: [Payments]
      summary: Read payment-account binding for a participant
      description: >
        GetPaymentAccount(participantId). Called by AC-06 before creating a
        self-billing Stripe invoice. Returns the Connect account id owned by
        Stripe when the producer has completed (or been provisioned for) KYC.
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            $ref: '../components/schemas.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Payment-account binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '404':
          $ref: '../components/schemas.yaml#/components/responses/NotFound'
  /connected-customers:ensure:
    post:
      operationId: ensureConnectedCustomer
      tags: [Payments]
      summary: Get or create the consumer's Customer on a producer Connect account
      description: >
        INT-355 / REQ-014 — returns the Stripe Customer that represents the
        consumer on the producer's connected account, creating it on first use.
        One Customer per (consumer, connected account), reused for every invoice
        of that pair. Called by AC-06 before creating the self-billing Stripe
        invoice so that AC-07 can later pay that invoice on the connected account
        (direct charge). AC-07 owns the mapping; the Customer carries only the
        participantId in metadata (no personal data). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participantId, stripeAccountId]
              properties:
                participantId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                stripeAccountId:
                  type: string
                  pattern: '^acct_'
                  description: Producer Connect account id (acct_…).
      responses:
        '200':
          description: Connected-account Customer for this consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedCustomer'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
  /payment-accounts:provision:
    post:
      operationId: provisionPaymentAccount
      tags: [Payments]
      summary: Provision a fresh Stripe Connect (or consumer) binding
      description: >
        INT-228 — create a **new** Stripe test-mode Connect Custom account for a
        producer (with INT-195 magic KYC values so charges_enabled becomes true),
        bind it in AC-07, and return the real acct_ id. Set fresh=true to always
        create a new Stripe account even if one is already bound (each seed/run
        must leave visible artifacts in the Stripe Dashboard).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participantId, communityId, role]
              properties:
                participantId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                communityId:
                  $ref: '../components/schemas.yaml#/components/schemas/Uuid'
                role:
                  type: string
                  enum: [producer, consumer, prosumer]
                fresh:
                  type: boolean
                  description: When true, always create a new Stripe entity.
                  default: true
      responses:
        '201':
          description: Provisioned (new Stripe entity created or rebound).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '200':
          description: Existing binding reused (fresh=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        '400':
          $ref: '../components/schemas.yaml#/components/responses/BadRequest'
components:
  schemas:
    ConnectedCustomer:
      type: object
      additionalProperties: false
      required: [participantId, stripeAccountId, stripeCustomerId]
      properties:
        participantId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        stripeAccountId:
          type: string
          description: Producer Connect account id (acct_…).
        stripeCustomerId:
          type: string
          description: Customer id (cus_…) on that connected account.
    PaymentStatus:
      type: object
      additionalProperties: false
      required: [paymentId, invoiceId, status]
      properties:
        paymentId:
          type: string
        invoiceId:
          type: string
        status:
          type: string
          description: AC-07 payment status (succeeded, failed, pending, …).
    PaymentAccount:
      type: object
      additionalProperties: false
      required: [participantId, role, communityId, kycStatus]
      properties:
        participantId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        stripeAccountId:
          type: [string, "null"]
          description: Connect account id (acct_…) when role is producer/prosumer.
        paymentMethodId:
          type: [string, "null"]
          description: Consumer payment method id when present.
        kycStatus:
          type: string
        role:
          type: string
          enum: [producer, consumer, prosumer]
        communityId:
          $ref: '../components/schemas.yaml#/components/schemas/Uuid'
        chargesEnabled:
          type: boolean
          description: Stripe charges_enabled when known (producer).
  securitySchemes:
    serviceAuth:
      $ref: '../components/schemas.yaml#/components/securitySchemes/serviceAuth'
