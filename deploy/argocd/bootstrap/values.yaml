# Argo CD Helm values for k8s-intelligent-eu-dev (INT-155 / TD-11).
# Official chart: argo/argo-cd (Apache-2.0). No secrets here.
#
# TLS for ops.intelligent-eu-bp.blooo.dev comes later via APISIX + cert-manager.
# Until then operators use `kubectl -n argocd port-forward svc/argocd-server 8080:443`.

configs:
  params:
    # Terminate TLS at the future ingress; port-forward uses HTTP locally.
    server.insecure: true

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # INT-385 — the full health check runs every repo render; with a 1s timeout and
  # 500m CPU the repo-server was killed by its liveness probe (exit 137) about
  # every few minutes, so every Application went Unknown.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5

controller:
  # INT-219 — 1Gi OOMKilled under ~40 Applications; raise before GitOps stalls.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Single replica is enough for non-production (physical §6).
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
