apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-cd-smoke
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: v0.0.0
    path: deploy/charts/cd-smoke
    helm:
      valueFiles:
        - ../../envs/demo/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
