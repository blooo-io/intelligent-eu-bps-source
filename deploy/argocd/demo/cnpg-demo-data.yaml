# INT-158 / TD-6 — demo-data CNPG Cluster (manual; not tracking develop).
# Apply a release tag or pin revision when demo is provisioned.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-cnpg-demo-data
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: v1.0.1
    path: deploy/charts/cnpg-int-data
    helm:
      valueFiles:
        - values.yaml
        # INT-358 — 30-day backup retention and demo bucket / OpenBao path.
        - values-demo.yaml
      parameters:
        - name: clusterName
          value: demo-data
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
