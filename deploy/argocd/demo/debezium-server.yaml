# Demo follows release tag v1.0.1 (INT-359). Sync stays manual.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-debezium-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: v1.0.1
    path: deploy/charts/debezium-server
    helm:
      # Chart values only — envs/demo image.tag would override the quay.io tag.
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-data
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
