# Demo follows release tag v1.0.1 (INT-359). Sync stays manual.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-participants
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: v1.0.1
    path: deploy/charts/participants
    helm:
      valueFiles:
        - ../../envs/demo/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
