apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-debezium-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/debezium-server
    helm:
      valueFiles:
        - values.yaml
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: int-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
