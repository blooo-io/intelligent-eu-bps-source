apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-debezium-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/debezium-server
    helm:
      # Chart values only — do not merge envs/dev (that file sets image.tag=develop
      # for GHCR module images; Debezium pulls quay.io/debezium/server:2.7.3.Final).
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: int-data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
