# INT-224 — Mailpit SMTP catcher for Keycloak invitations + AC-11 (dev).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-mailpit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/mailpit
    helm:
      valueFiles:
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: int-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
