# INT-224 — Mailpit SMTP catcher for Keycloak invitations + AC-11 (dev).
# Do not load envs/dev/values.yaml: that file sets image.tag=develop for
# GHCR module images and would override axllent/mailpit:v1.22.3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-mailpit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: develop
    path: deploy/charts/mailpit
  destination:
    server: https://kubernetes.default.svc
    namespace: int-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
