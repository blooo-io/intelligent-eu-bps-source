apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-notification
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: develop
    path: deploy/charts/notification
    helm:
      valueFiles:
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: int-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
