# INT-358 — ExternalSecret for the Alertmanager Slack webhook (wave 2: needs ESO + OpenBao store).
# Alertmanager mounts the Secret as an optional volume, so it starts before this syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-alertmanager-slack-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: develop
    path: deploy/charts/alertmanager-slack-secret
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
