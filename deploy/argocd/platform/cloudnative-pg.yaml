# INT-158 / TD-6 — CloudNativePG operator (sync wave 0: CRDs first).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        valueFiles:
          - $values/deploy/platform/cloudnative-pg/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
