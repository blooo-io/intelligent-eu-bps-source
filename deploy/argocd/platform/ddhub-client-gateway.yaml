# INT-308 — DDHub Client Gateway (wave 3: after CNPG + gateway secret).
# Local chart (correct typeorm migration command); unmodified upstream images.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ddhub-client-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      path: deploy/charts/ddhub-client-gateway
      helm:
        valueFiles:
          - $values/deploy/platform/ddhub-client-gateway/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ddhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .metadata.annotations
        - .status
