# INT-308 — ExternalSecret + NetworkPolicy for DDHub CG (wave 2: needs ESO + OpenBao store).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ddhub-gateway-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: develop
    path: deploy/charts/ddhub-gateway-secret
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ddhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
