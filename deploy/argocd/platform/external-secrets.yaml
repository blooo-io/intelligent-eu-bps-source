# INT-133 / TD-9 — External Secrets Operator (sync wave 0: CRDs first).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        valueFiles:
          - $values/deploy/platform/external-secrets/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
