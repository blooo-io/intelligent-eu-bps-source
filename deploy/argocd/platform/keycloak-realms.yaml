# INT-169 — realm ConfigMaps before Keycloak starts (wave 2 with admin secret).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-keycloak-realms
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/keycloak-realms
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
