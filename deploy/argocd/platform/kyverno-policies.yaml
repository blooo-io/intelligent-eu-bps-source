# INT-315 — Kyverno baseline policies for int-apps (after platform-kyverno CRDs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
    targetRevision: develop
    path: deploy/charts/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # INT-384 — Kyverno defaults these fields and fills status.autogen.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .status
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
