# INT-114 / TD-9 — Let's Encrypt ClusterIssuer (wave 3: after APISIX IngressClass).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-letsencrypt-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/letsencrypt-issuer
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
