# INT-133 / TD-9 — OpenBao unmodified (MPL-2.0 exception). Sync wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.4
      helm:
        valueFiles:
          - $values/deploy/platform/openbao/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
