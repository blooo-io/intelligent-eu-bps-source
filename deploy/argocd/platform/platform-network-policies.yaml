# INT-288 / INT-313 — NetworkPolicies for Keycloak, OpenBao, APISIX, Temporal,
# SonarQube, observability (SEC-02).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-network-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/platform-network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
