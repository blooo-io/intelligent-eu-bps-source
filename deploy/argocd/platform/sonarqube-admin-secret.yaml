# INT-293 — ExternalSecret for SonarQube admin password (wave 2: needs ESO + OpenBao store).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sonarqube-admin-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/sonarqube-admin-secret
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
