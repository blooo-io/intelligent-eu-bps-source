# INT-292 — SonarQube Community Build (wave 2: after its CNPG database).
# Official chart; community.enabled=true. Separate unmodified service (TP-2 exception).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sonarqube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: 2026.5.1002
      helm:
        valueFiles:
          - $values/deploy/platform/sonarqube/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # STS volumeClaimTemplates / defaulted fields drift under SSA (same pattern as OpenBao).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.template.metadata.annotations
        - .metadata.annotations
        - .status
