# INT-172 / TD-3 — Temporal namespaces int / demo after the server (wave 3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-temporal-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
    targetRevision: develop
    path: deploy/charts/temporal-namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
