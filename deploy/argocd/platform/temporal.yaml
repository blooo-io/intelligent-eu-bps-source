# INT-159 / TD-3 — Temporal server (wave 2: after its CNPG databases).
# Official temporal/temporal Helm chart (MIT).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-temporal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://go.temporal.io/helm-charts
      chart: temporal
      targetRevision: 1.7.0
      helm:
        valueFiles:
          - $values/deploy/platform/temporal/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
