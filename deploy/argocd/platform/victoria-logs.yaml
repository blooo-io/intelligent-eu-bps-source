# INT-134 / TD-10 — VictoriaLogs (sync wave 1; Apache-2.0 log store).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-victoria-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-logs-single
      targetRevision: 0.13.10
      helm:
        valueFiles:
          - $values/deploy/platform/victoria-logs/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-bps-source.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # INT-226 — VictoriaLogs StatefulSet VCT / annotation drift under SSA.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.template.metadata.annotations
        - .metadata.annotations
        - .status
