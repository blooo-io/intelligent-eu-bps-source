# INT-134 / TD-10 — VictoriaLogs (sync wave 1; Apache-2.0 log store).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-victoria-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-logs-single
      targetRevision: 0.13.10
      helm:
        valueFiles:
          - $values/deploy/platform/victoria-logs/values.yaml
    - repoURL: https://github.com/blooo-io/intelligent-eu-billing-and-payment.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
