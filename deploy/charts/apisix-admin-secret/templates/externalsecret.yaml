apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    app.kubernetes.io/name: apisix-admin-secret
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: admin
      remoteRef:
        key: {{ .Values.openbaoPath }}
        property: admin
    - secretKey: viewer
      remoteRef:
        key: {{ .Values.openbaoPath }}
        property: viewer
