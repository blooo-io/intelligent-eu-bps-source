{{- /*
  INT-169 — OIDC client_secret for openid-connect (required by APISIX 3.14
  even with bearer_only). Value lives in OpenBao, never in Git.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidc.secretName }}
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidc.storeName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.oidc.secretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Only keys that merge into the openid-connect plugin config.
        client_secret: "{{ `{{ .client_secret }}` }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: {{ .Values.oidc.openbaoPath | quote }}
        property: {{ .Values.oidc.openbaoProperty | quote }}
