{{- /*
  INT-114 / TD-8 / INT-455 — ApisixRoute catalogue (03 §3.1 + physical §3).
  Public REST /v1 and reference web routes withdrawn (INT-455). Webhook
  unauthenticated + rate-limited; auth → Keycloak; docs → docs-portal.
*/ -}}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: payment-webhook
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
    - name: payment-provider-webhook
      priority: 100
      match:
        hosts:
          - {{ .Values.hosts.api | quote }}
        paths:
          - {{ .Values.webhook.path | quote }}
        methods:
          - POST
      backends:
        - serviceName: {{ .Values.webhook.backend }}
          servicePort: 8080
      plugins:
{{ include "apisix-gateway.securityHeadersPlugin" (dict "Values" .Values "csp" .Values.securityHeaders.csp.api) | nindent 8 }}
        - name: limit-req
          enable: true
          config:
            rate: {{ .Values.webhook.rate.rate }}
            burst: {{ .Values.webhook.rate.burst }}
            rejected_code: 429
            key_type: var
            key: remote_addr
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: auth-idp
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
    # INT-404 — stricter limit on the OIDC token endpoint (docs password grant).
    - name: keycloak-token
      priority: 20
      match:
        hosts:
          - {{ .Values.hosts.auth | quote }}
        paths:
          - /realms/int/protocol/openid-connect/token
          - /realms/demo/protocol/openid-connect/token
      backends:
        - serviceName: keycloak
          servicePort: {{ .Values.backends.keycloak.port }}
      plugins:
        - name: limit-req
          enable: true
          config:
            rate: {{ .Values.auth.tokenRate.rate }}
            burst: {{ .Values.auth.tokenRate.burst }}
            rejected_code: 429
            key_type: var
            key: remote_addr
{{ include "apisix-gateway.securityHeadersPlugin" (dict "Values" .Values "csp" .Values.securityHeaders.csp.auth) | nindent 8 }}
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              set:
                Forwarded: {{ printf "proto=https;host=%s;port=443" .Values.hosts.auth | quote }}
                X-Forwarded-Proto: https
                X-Forwarded-Port: "443"
                X-Forwarded-Host: {{ .Values.hosts.auth | quote }}
    - name: keycloak
      priority: 10
      match:
        hosts:
          - {{ .Values.hosts.auth | quote }}
        paths:
          - /*
      backends:
        - serviceName: keycloak
          servicePort: {{ .Values.backends.keycloak.port }}
      plugins:
{{ include "apisix-gateway.securityHeadersPlugin" (dict "Values" .Values "csp" .Values.securityHeaders.csp.auth) | nindent 8 }}
        # INT-171 — KC_PROXY_HEADERS=forwarded honors RFC7239 Forwarded (not only X-Forwarded-*).
        - name: proxy-rewrite
          enable: true
          config:
            headers:
              set:
                Forwarded: {{ printf "proto=https;host=%s;port=443" .Values.hosts.auth | quote }}
                X-Forwarded-Proto: https
                X-Forwarded-Port: "443"
                X-Forwarded-Host: {{ .Values.hosts.auth | quote }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: docs-portal
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
    - name: docs
      priority: 10
      match:
        hosts:
          - {{ .Values.hosts.docs | quote }}
        paths:
          - /*
      backends:
        - serviceName: docs-portal
          servicePort: 8080
      plugins:
{{ include "apisix-gateway.securityHeadersPlugin" (dict "Values" .Values "csp" .Values.securityHeaders.csp.docs) | nindent 8 }}
---
{{- if .Values.hosts.sonar }}
# INT-292 — SonarQube Community Build (scanner token + UI login; not Keycloak OIDC).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: sonarqube
  labels:
    app.kubernetes.io/name: apisix-gateway
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
    - name: sonar
      priority: 10
      match:
        hosts:
          - {{ .Values.hosts.sonar | quote }}
        paths:
          - /*
      backends:
        - serviceName: sonarqube
          servicePort: {{ .Values.backends.sonarqube.port }}
      plugins:
{{ include "apisix-gateway.securityHeadersPlugin" (dict "Values" .Values "csp" .Values.securityHeaders.csp.docs) | nindent 8 }}
{{- end }}
