# INT-114 / TD-8 — route catalogue values (no secrets).
# Hosts from physical architecture §3. Backends are ExternalName → module Services.
ingressClassName: apisix
environment: dev

hosts:
  api: api.dev.intelligent-eu-bp.blooo.dev
  auth: auth.intelligent-eu-bp.blooo.dev
  app: app.dev.intelligent-eu-bp.blooo.dev

# Keycloak realm used by openid-connect (INT-169 realm import on Keycloak boot).
oidc:
  realm: int
  discoveryHost: auth.intelligent-eu-bp.blooo.dev
  bearerOnly: true
  clientId: apisix-gateway
  # TLS on auth host is Let's Encrypt (staging/prod); verify once prod issuer is on.
  sslVerify: false
  # Secret keys merge into plugin config (must include client_secret — APISIX 3.14).
  secretName: apisix-oidc
  storeName: openbao
  openbaoPath: platform/apisix
  openbaoProperty: oidc_client_secret

backends:
  appsNamespace: int-apps
  keycloak:
    externalName: platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
    port: 80
  modules:
    - name: participants
      port: 8080
    - name: payments
      port: 8080
    - name: settlement
      port: 8080
    - name: invoicing
      port: 8080
    - name: reporting
      port: 8080
    - name: reconciliation
      port: 8080
    - name: trade-intake
      port: 8080
    - name: compliance
      port: 8080
    - name: scheduler
      port: 8080
    - name: web
      port: 8080

webhook:
  # POST /webhooks/payment-provider — only unauthenticated public route (NFR-015).
  path: /webhooks/payment-provider
  backend: payments
  rate:
    rate: 20
    burst: 40

tls:
  # INT-168 — enable once DNS A/CNAME points at the APISIX LoadBalancer.
  enabled: false
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer

