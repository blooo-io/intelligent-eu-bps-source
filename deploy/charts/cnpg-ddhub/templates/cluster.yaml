{{- /*
  INT-308 — DDHub CG DB. Role password via ESO Password generator (create once).
  Avoids OpenBao race that left managed role pending-reconciliation.
*/ -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clusterName }}-db-password
  labels:
    app.kubernetes.io/name: cnpg-ddhub
spec:
  length: 32
  # ESO Password CRD expects integer counts, not booleans (INT-163).
  digits: 5
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.owner }}-db
  labels:
    app.kubernetes.io/name: cnpg-ddhub
spec:
  refreshInterval: "0"
  target:
    name: {{ .Values.database.owner }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: {{ .Values.database.owner | quote }}
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.clusterName }}-db-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  labels:
    app.kubernetes.io/name: cnpg-ddhub
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: ewds-database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName | quote }}
  storage:
    size: {{ .Values.storage.size | quote }}
  enableSuperuserAccess: false
  managed:
    roles:
      - name: {{ .Values.database.owner }}
        ensure: present
        login: true
        comment: "DDHub Client Gateway database owner (INT-308)"
        passwordSecret:
          name: {{ .Values.database.owner }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.database.name }}
  labels:
    app.kubernetes.io/name: cnpg-ddhub
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: ewds-database
spec:
  name: {{ .Values.database.name }}
  owner: {{ .Values.database.owner }}
  ensure: present
  cluster:
    name: {{ .Values.clusterName }}
