# INT-308 — DDHub Client Gateway database on CNPG (Apache-2.0). No passwords in Git.
# Role password: ESO Password generator (same pattern as cnpg-sonarqube).
clusterName: ddhub
instances: 1
storage:
  size: 10Gi
imageName: ghcr.io/cloudnative-pg/postgresql:16.6
database:
  name: ddhub
  owner: ddhub
