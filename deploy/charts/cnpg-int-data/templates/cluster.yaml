{{- /*
  INT-158 / TD-6 — CNPG Cluster for int-data.
  Role passwords: ESO Password generator → kubernetes.io/basic-auth Secret
  (refreshInterval 0 = create once). Never store DB passwords in Git.
  Database CRs create one database owned by each role.
*/ -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.clusterName }}-db-password
  labels:
    app.kubernetes.io/name: cnpg-int-data
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
spec:
  length: 32
  # ESO Password CRD expects integer counts, not booleans (INT-163).
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
{{- range .Values.databases }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | replace "_" "-" }}-db
  labels:
    app.kubernetes.io/name: cnpg-int-data
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    intelligent.eu/module: {{ .module | quote }}
spec:
  refreshInterval: "0"
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: {{ .name | quote }}
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $.Values.clusterName }}-db-password
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.clusterName }}
  labels:
    app.kubernetes.io/name: cnpg-int-data
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName | quote }}
  storage:
    size: {{ .Values.storage.size | quote }}
  postgresql:
    parameters:
      wal_level: {{ .Values.postgresql.parameters.wal_level | quote }}
      max_replication_slots: {{ .Values.postgresql.parameters.max_replication_slots | quote }}
      max_wal_senders: {{ .Values.postgresql.parameters.max_wal_senders | quote }}
  enableSuperuserAccess: false
  managed:
    roles:
{{- range .Values.databases }}
      - name: {{ .name }}
        ensure: present
        login: true
        comment: "Module {{ .module }} (INT-158 / TD-6)"
        passwordSecret:
          name: {{ .name }}
{{- end }}
---
{{- range .Values.databases }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .name | replace "_" "-" }}
  labels:
    app.kubernetes.io/name: cnpg-int-data
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: database
    intelligent.eu/module: {{ .module | quote }}
spec:
  name: {{ .name }}
  owner: {{ .name }}
  ensure: present
  cluster:
    name: {{ $.Values.clusterName }}
---
{{- end }}
