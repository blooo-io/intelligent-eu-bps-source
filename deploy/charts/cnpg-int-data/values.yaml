# INT-158 / TD-6 — V1 / virtual dev cluster in int-data.
# One database and one login role per NestJS module (physical §3, TD-6).
# SQL identifiers use underscores (PostgreSQL). Chart names with hyphens map here.
# CNPG generates role passwords into Kubernetes Secrets — never commit them.

clusterName: int-data
instances: 1
storage:
  size: 20Gi
imageName: ghcr.io/cloudnative-pg/postgresql:16.6

# Logical decoding for Debezium Server CDC (INT-132) once replicas are raised.
postgresql:
  parameters:
    wal_level: logical
    max_replication_slots: "16"
    max_wal_senders: "16"

# INT-358 / PD-4 — continuous backup: WAL archiving + daily base backup to
# Scaleway Object Storage (nl-ams, one bucket per environment), PITR.
# Retention 7 days for int/dev, 30 days for demo (values-demo.yaml).
# Object-store keys: ExternalSecret from OpenBao `openbaoPath`
# (properties access_key_id / secret_access_key) — never in Git.
# The bucket and the OpenBao path must exist before sync, otherwise WAL
# archiving fails and WAL files pile up on the data volume.
# Off until the Scaleway buckets exist and the OpenBao paths are seeded.
backup:
  enabled: false
  retentionPolicy: 7d
  endpointURL: https://s3.nl-ams.scw.cloud
  region: nl-ams
  # barman appends the server name (= clusterName) under this prefix.
  destinationPath: s3://intelligent-eu-bps-backups-dev/
  walCompression: gzip
  dataCompression: gzip
  # Six-field cron (seconds first): daily base backup at 02:00 UTC.
  schedule: "0 0 2 * * *"
  storeName: openbao
  openbaoPath: dev/cnpg-backup
  # Archive folder under destinationPath; defaults to clusterName. Set a new
  # value after a PITR restore, since barman refuses a non-empty WAL archive.
  serverName: ""

# PITR (docs/release/deployment.md). Only read when the Cluster is created, so a
# restore under the same name also needs the existing Cluster removed.
recovery:
  enabled: false
  # Archive folder to restore from (the serverName that wrote the backups).
  sourceServerName: int-data
  # RFC 3339 timestamp; empty = replay to the end of the archived WAL.
  targetTime: ""

# name = PostgreSQL database + role; module = deploy chart / service directory.
databases:
  - name: participants
    module: participants
  - name: trade_intake
    module: trade-intake
  - name: settlement
    module: settlement
  - name: invoicing
    module: invoicing
  - name: payments
    module: payments
  - name: reconciliation
    module: reconciliation
  - name: reporting
    module: reporting
  - name: publication
    module: publication
  - name: notification
    module: notification
  - name: compliance
    module: compliance
  - name: reference_data
    module: reference-data
  - name: scheduler
    module: scheduler
  - name: mocks
    module: mocks
