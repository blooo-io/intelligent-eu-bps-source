{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-scheduler
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-scheduler
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: ewds-client-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-scheduler
    spec:
      serviceAccountName: {{ .Values.name }}
      initContainers:
        - name: typeorm-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "./node_modules/.bin/typeorm"
            - "migration:run"
            - "-d"
            - "ormconfig.js"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
            - secretRef:
                name: {{ .Values.secretName }}
          # Scheduler image (intelligent-canary) does not expose /api/v2/health; probes OOM-kill loop.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
