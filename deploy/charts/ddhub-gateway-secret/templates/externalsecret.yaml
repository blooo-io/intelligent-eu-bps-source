{{- /*
  INT-308 — Secret expected by CG pods: nameOverride + "-secret"
  with keys DB_NAME (Postgres URI) and VAULT_TOKEN.
  Password from CNPG Secret; vault_token from OpenBao.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    app.kubernetes.io/name: ddhub-gateway-secret
    app.kubernetes.io/part-of: intelligent-eu-bps-source
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VAULT_TOKEN: "{{ `{{ .vault_token }}` }}"
        DB_NAME: "postgresql://{{ .Values.dbUser }}:{{ `{{ .db_password | urlquery }}` }}@{{ .Values.dbHost }}:{{ .Values.dbPort }}/{{ .Values.dbName }}"
  data:
    - secretKey: vault_token
      remoteRef:
        key: {{ .Values.openbaoPath }}
        property: vault_token
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: {{ .Values.k8sStoreName }}
          kind: SecretStore
      remoteRef:
        key: {{ .Values.cnpgSecretName }}
        property: password
