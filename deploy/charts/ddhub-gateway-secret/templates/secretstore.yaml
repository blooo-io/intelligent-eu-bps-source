{{- /*
  INT-308 — read CNPG role password from Secret ddhub for DB_NAME URI assembly.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.esoReaderServiceAccount }}
  labels:
    app.kubernetes.io/name: ddhub-gateway-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.esoReaderServiceAccount }}
  labels:
    app.kubernetes.io/name: ddhub-gateway-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.esoReaderServiceAccount }}
  labels:
    app.kubernetes.io/name: ddhub-gateway-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.esoReaderServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.esoReaderServiceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.k8sStoreName }}
  labels:
    app.kubernetes.io/name: ddhub-gateway-secret
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.esoReaderServiceAccount }}
