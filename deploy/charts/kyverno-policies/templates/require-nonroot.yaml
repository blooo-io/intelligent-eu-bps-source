{{- /*
  INT-315 — align with module chart securityContext (runAsNonRoot, drop ALL, no escalation).
*/ -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: int-apps-require-nonroot
  labels:
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: int-apps-baseline
spec:
  validationFailureAction: {{ .Values.validationFailureAction | quote }}
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.appsNamespace | quote }}
      validate:
        message: "int-apps pods must set runAsNonRoot (module chart securityContext)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.appsNamespace | quote }}
      validate:
        message: "int-apps containers must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
