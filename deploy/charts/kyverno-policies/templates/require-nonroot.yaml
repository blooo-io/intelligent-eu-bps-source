{{- /*
  INT-315 / INT-328 — align with module chart securityContext
  (runAsNonRoot, drop ALL, no escalation) on int-apps and demo-apps.
*/ -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: apps-require-nonroot
  labels:
    app.kubernetes.io/name: kyverno-policies
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: apps-baseline
spec:
  validationFailureAction: {{ .Values.validationFailureAction | quote }}
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                {{- range .Values.appsNamespaces }}
                - {{ . | quote }}
                {{- end }}
      validate:
        message: "apps pods must set runAsNonRoot (module chart securityContext)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                {{- range .Values.appsNamespaces }}
                - {{ . | quote }}
                {{- end }}
      validate:
        message: "apps containers must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
