{{- /*
  INT-328 / SEC-02 — Mailpit is ClusterIP-only; SMTP from Keycloak, no public UI.
  Operators reach the UI via kubectl port-forward (host path), not APISIX.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Keycloak realm SMTP (int / demo) → mailpit.int-apps:1025.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.keycloakNamespace | quote }}
      ports:
        - port: {{ .Values.service.smtpPort }}
          protocol: TCP
    # Same-namespace peers (e.g. future notification SMTP) on SMTP only.
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.smtpPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
