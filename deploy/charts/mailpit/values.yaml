name: mailpit
component: mail-catcher
replicaCount: 1
image:
  repository: axllent/mailpit
  tag: "v1.22.3"
service:
  smtpPort: 1025
  uiPort: 8025
# INT-328 — SMTP allow-list; UI stays ClusterIP + port-forward only.
networkPolicy:
  keycloakNamespace: keycloak
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
