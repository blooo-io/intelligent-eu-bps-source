apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
data:
  nats.conf: |
    port: {{ .Values.service.clientPort }}
    http: {{ .Values.service.monitorPort }}
    jetstream {
      store_dir: {{ .Values.config.jetstream.storeDir }}
    }
    # Account resolution: mount OpenBao-synced credentials when present.
    # Until ExternalSecret is bound (INT-133), JetStream runs with the default account.
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
    - name: monitor
      port: {{ .Values.service.monitorPort }}
      targetPort: monitor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  serviceName: {{ .Values.name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
        app.kubernetes.io/component: {{ .Values.component }}
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/nats/nats.conf
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: monitor
              containerPort: {{ .Values.service.monitorPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: {{ .Values.config.jetstream.storeDir }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 2
      volumes:
        - name: config
          configMap:
            name: {{ .Values.name }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Optional account credentials from OpenBao (INT-133). Chart stays secret-free.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.config.accountsFromSecret }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: {{ .Values.config.accountsFromSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: platform/nats/accounts
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.service.clientPort }}
          protocol: TCP
        - port: {{ .Values.service.monitorPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
