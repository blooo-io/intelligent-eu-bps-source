# Shared platform — destination namespace is always `nats` (physical §3).
name: nats
component: event-bus
replicaCount: 1
image:
  repository: nats
  tag: "2.10.24-alpine"
# JetStream on; client port matches module NetworkPolicy egress (4222).
config:
  jetstream:
    enabled: true
    storeDir: /data
  # One NATS account per environment (int / demo). Credentials come from OpenBao
  # via ExternalSecret — no secret values in Git (NFR-005).
  accountsFromSecret: nats-accounts
service:
  clientPort: 4222
  monitorPort: 8222
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
