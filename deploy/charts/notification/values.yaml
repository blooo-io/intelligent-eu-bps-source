name: notification
component: AC-11
environment: dev
dataNamespace: int-data
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-billing-and-payment/services-notification
  tag: "0.0.0"
port: 8080
# INT-287 — peer allow-list only (no namespace-wide ingress).
egressModules:
  - participants
ingressFrom: []
keycloakEgress: true
stripeEgress: false
# INT-217 / INT-221 — Debezium Server 2.7 create-stream always names the
# stream DebeziumStream (subjects *.*.*); JetStream forbids a second stream
# with overlapping subjects, so AC-11 consumes that stream.
# INT-274 — AC-03 notification contact + operator alert mailbox.
env:
  KEYCLOAK_BASE_URL: http://platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
  KEYCLOAK_REALM: int
  KEYCLOAK_SERVICE_CLIENT_ID: module-service
  KEYCLOAK_SERVICE_CLIENT_SECRET: dev-module-service-replace-me
  # INT-314 — require Bearer JWT on /internal/* (forgeable headers alone rejected).
  SERVICE_JWT_REQUIRED: "true"
  NATS_URL: nats://nats.nats.svc.cluster.local:4222
  NATS_SUBJECT_PREFIX: intelligent.dev
  NATS_STREAM: DebeziumStream
  PARTICIPANTS_INTERNAL_URL: http://participants:8080
  OPERATOR_ALERT_TO: uat-operator@example.invalid
