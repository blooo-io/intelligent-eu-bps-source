# BR / TD-9: ESO reads OpenBao; module ExternalSecrets reference kind ClusterSecretStore name openbao.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
  labels:
    app.kubernetes.io/name: openbao-store
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: secrets
spec:
  provider:
    # OpenBao speaks the Vault K/V API; ESO vault provider is the supported client.
    vault:
      server: {{ .Values.server | quote }}
      path: {{ .Values.path | quote }}
      version: {{ .Values.version | quote }}
      auth:
        tokenSecretRef:
          name: {{ .Values.auth.tokenSecretName | quote }}
          namespace: {{ .Values.auth.tokenSecretNamespace | quote }}
          key: {{ .Values.auth.tokenSecretKey | quote }}
