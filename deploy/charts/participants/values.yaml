name: participants
component: AC-03
environment: dev
dataNamespace: int-data
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-billing-and-payment/services-participants
  tag: "0.0.0"
port: 8080
egressModules: []
ingressFrom: 
  - invoicing
  - settlement
  - trade-intake
  - payments
keycloakEgress: true
stripeEgress: false
namespaceIngress: true
# INT-215 — enable Keycloak Admin P-IDP (matches int-realm client secret).
env:
  IDP_ADMIN_PROVIDER: keycloak
  KEYCLOAK_BASE_URL: http://keycloak.keycloak.svc.cluster.local:8080
  KEYCLOAK_REALM: int
  KEYCLOAK_ADMIN_CLIENT_ID: participants-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: dev-participants-admin-replace-me
