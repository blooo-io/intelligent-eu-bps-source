name: participants
component: AC-03
environment: dev
dataNamespace: int-data
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-bps-source/services-participants
  tag: "0.0.0"
port: 8080
# INT-287 — peer allow-list only (no namespace-wide ingress).
egressModules: []
ingressFrom:
  - invoicing
  - settlement
  - trade-intake
  - payments
  - notification
keycloakEgress: true
stripeEgress: false
# INT-215 / INT-218 — Keycloak Admin P-IDP (matches int-realm client secret).
# Service DNS is platform-keycloak-keycloakx-http (port 80), not keycloak:8080.
env:
  IDP_ADMIN_PROVIDER: keycloak
  KEYCLOAK_BASE_URL: http://platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
  KEYCLOAK_REALM: int
  KEYCLOAK_ADMIN_CLIENT_ID: participants-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: dev-participants-admin-replace-me
  KEYCLOAK_SERVICE_CLIENT_ID: module-service
  KEYCLOAK_SERVICE_CLIENT_SECRET: dev-module-service-replace-me
  # INT-314 — require Bearer JWT on /internal/* (forgeable headers alone rejected).
  SERVICE_JWT_REQUIRED: "true"
  NATS_URL: nats://nats.nats.svc.cluster.local:4222
  NATS_SUBJECT_PREFIX: intelligent.dev
  NATS_STREAM: DebeziumStream
