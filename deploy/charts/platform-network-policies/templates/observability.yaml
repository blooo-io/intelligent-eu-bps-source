{{- /*
  INT-313 — Observability dataplane: OTLP from int-apps; collector → Jaeger / VictoriaLogs.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: {{ .Values.observabilityNamespace | quote }}
  labels:
    app.kubernetes.io/name: platform-network-policies
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: otel-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appsNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observabilityNamespace }}
      ports:
        {{- range .Values.observability.otlpPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        - port: {{ .Values.observability.metricsPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-logs-single
      ports:
        - port: {{ .Values.observability.victoriaLogsPort }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
  namespace: {{ .Values.observabilityNamespace | quote }}
  labels:
    app.kubernetes.io/name: platform-network-policies
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: jaeger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observabilityNamespace }}
      ports:
        {{- range .Values.observability.otlpPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
        - port: {{ .Values.observability.jaegerUiPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-logs
  namespace: {{ .Values.observabilityNamespace | quote }}
  labels:
    app.kubernetes.io/name: platform-network-policies
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: victoria-logs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observabilityNamespace }}
      ports:
        - port: {{ .Values.observability.victoriaLogsPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
