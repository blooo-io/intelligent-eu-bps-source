{{- /*
  INT-288 — OpenBao: ingress from ESO + DDHub CG (+ optional int-apps operators via ESO only).
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-server
  namespace: {{ .Values.openbaoNamespace | quote }}
  labels:
    app.kubernetes.io/name: platform-network-policies
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.externalSecretsNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ddhubNamespace }}
      ports:
        - port: {{ .Values.openbao.apiPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Raft / cluster peer (same StatefulSet).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - port: {{ .Values.openbao.apiPort }}
          protocol: TCP
        - port: 8201
          protocol: TCP
