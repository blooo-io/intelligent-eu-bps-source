# INT-288 / INT-313 — selectors match live Scaleway labels (platform-* Helm releases).
appsNamespace: int-apps
keycloakNamespace: keycloak
openbaoNamespace: openbao
ingressNamespace: ingress
externalSecretsNamespace: external-secrets
ddhubNamespace: ddhub
temporalNamespace: temporal
sonarqubeNamespace: sonarqube
observabilityNamespace: observability

keycloak:
  # HTTP/OIDC from APISIX + Admin IdP from modules (participants keycloakEgress).
  httpPorts:
    - 80
    - 8080
    - 8443
    - 9000
  postgresPort: 5432
  # INT-344 — realm SMTP host mailpit.<appsNamespace>:1025 (TD-12 / INT-224).
  mailpitSmtpPort: 1025

openbao:
  apiPort: 8200

apisix:
  httpPort: 9080
  httpsPort: 9443
  adminPort: 9180
  etcdPort: 2379

temporal:
  frontendPort: 7233
  webPort: 8080
  postgresPort: 5432

sonarqube:
  httpPort: 9000
  postgresPort: 5432

observability:
  otlpPorts:
    - 4317
    - 4318
  metricsPort: 8889
  victoriaLogsPort: 9428
  jaegerUiPort: 16686
