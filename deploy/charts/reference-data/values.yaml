name: reference-data
component: AC-13
environment: dev
dataNamespace: int-data
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-bps-source/services-reference-data
  tag: "0.0.0"
port: 8080
# INT-287 — peer allow-list only (no namespace-wide ingress).
egressModules: []
ingressFrom:
  - scheduler-worker
  - settlement
keycloakEgress: true
stripeEgress: false
# INT-429 / NFR-017 — DDHub CGW client (label + CGW_API_KEY secretKeyRef via module template).
ewdsClient: true

# INT-287 — Keycloak client-credentials for inter-module JWT (dual-mode).
# A8 — chart defaults stay mock; deploy/envs overlays switch adapters live (A8-live).
env:
  KEYCLOAK_BASE_URL: http://platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
  # INT-348 — JWT iss is public KC_HOSTNAME (INT-345); JWKS stays on KEYCLOAK_BASE_URL.
  KEYCLOAK_ISSUER: https://auth.intelligent-eu-bp.blooo.dev/realms/int
  KEYCLOAK_REALM: int
  # NFR-013 / INT-357 — roles claim dot-path (same as apisix-gateway oidc.roleClaim).
  OIDC_ROLE_CLAIM: realm_access.roles
  KEYCLOAK_SERVICE_CLIENT_ID: module-service
  # INT-314 — require Bearer JWT on /internal/* (forgeable headers alone rejected).
  SERVICE_JWT_REQUIRED: "true"
  CGW_BASE_URL: http://ddhub-client-gateway.ddhub.svc.cluster.local
  MARKET_ADAPTER: mock
  DATASPACE_ADAPTER: mock
  ACTOR_SOURCE_ADAPTER: mock
  ERASURE_SOURCE_ADAPTER: mock
  TARIFF_ADAPTER: mock
  COMMAND_CHANNEL_ENABLED: "false"
