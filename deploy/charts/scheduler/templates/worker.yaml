{{- /*
  INT-216 — Temporal worker Deployment (same image, start:worker CMD).
  Polls task queue intelligent-billing and invokes owning module internal APIs.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-worker
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-worker
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
    app.kubernetes.io/component: {{ .Values.component }}-worker
spec:
  replicas: {{ .Values.workerReplicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-worker
        app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
        app.kubernetes.io/component: {{ .Values.component }}-worker
    spec:
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          # Distroless node image entrypoint is `node` (same as HTTP CMD).
          command: ["dist/temporal/worker.js"]
          envFrom:
            - secretRef:
                name: {{ .Values.name }}
                optional: true
            - secretRef:
                name: {{ .Values.name }}-database
                optional: true
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if not (hasKey (.Values.env | default dict) "TEMPORAL_TASK_QUEUE") }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporalTaskQueue | default "intelligent-billing" | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-worker
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
      ports:
        - port: 7233
          protocol: TCP
    {{- range .Values.egressModules }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
      ports:
        - port: {{ $.Values.port }}
          protocol: TCP
    {{- end }}
