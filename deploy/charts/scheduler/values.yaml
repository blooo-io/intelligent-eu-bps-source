name: scheduler
component: AC-14
environment: dev
dataNamespace: int-data
# INT-113 — Dockerfile present; roll out on :develop after supply-chain.
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-bps-source/services-scheduler
  tag: "0.0.0"
port: 8080
# INT-287 — peer allow-list only (no namespace-wide ingress).
egressModules:
  - settlement
  - trade-intake
  - reconciliation
  - compliance
  - reference-data
  - reporting
  - publication
  - invoicing
ingressFrom: []
keycloakEgress: true
stripeEgress: false
# INT-216 — Temporal frontend + worker (TD-3).
workerReplicaCount: 1
temporalTaskQueue: intelligent-billing
env:
  KEYCLOAK_BASE_URL: http://platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
  # INT-348 — JWT iss is public KC_HOSTNAME (INT-345); JWKS stays on KEYCLOAK_BASE_URL.
  KEYCLOAK_ISSUER: https://auth.intelligent-eu-bp.blooo.dev/realms/int
  KEYCLOAK_REALM: int
  # NFR-013 / INT-357 — roles claim dot-path (same as apisix-gateway oidc.roleClaim).
  OIDC_ROLE_CLAIM: realm_access.roles
  KEYCLOAK_SERVICE_CLIENT_ID: module-service
  # INT-314 — require Bearer JWT on /internal/* (forgeable headers alone rejected).
  SERVICE_JWT_REQUIRED: "true"
  DISPATCH_PROVIDER: temporal
  TEMPORAL_ADDRESS: platform-temporal-frontend.temporal.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: int
  TEMPORAL_TASK_QUEUE: intelligent-billing
