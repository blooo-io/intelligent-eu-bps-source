name: settlement
component: AC-05
environment: dev
dataNamespace: int-data
replicaCount: 1
image:
  repository: ghcr.io/blooo-io/intelligent-eu-bps-source/services-settlement
  tag: "0.0.0"
port: 8080
# INT-287 — peer allow-list only (no namespace-wide ingress).
egressModules: 
  - trade-intake
  - participants
  - reference-data
ingressFrom:
  - invoicing
  - scheduler-worker
keycloakEgress: true
stripeEgress: false
# INT-232 — HttpTradeSource → AC-04 GetUnbilledTrades + mark-billed.
# INT-272 — GetCommunitySettings (AC-03) + GetVatRate/GetRate (AC-13).
# INT-273 — JetStream ParticipantOffboarded → StartRun(type=final).
# Leave unset locally/CI to keep FixtureTradeSource + fixture billing context.
env:
  KEYCLOAK_BASE_URL: http://platform-keycloak-keycloakx-http.keycloak.svc.cluster.local
  # INT-348 — JWT iss is public KC_HOSTNAME (INT-345); JWKS stays on KEYCLOAK_BASE_URL.
  KEYCLOAK_ISSUER: https://auth.intelligent-eu-bp.blooo.dev/realms/int
  KEYCLOAK_REALM: int
  # NFR-013 / INT-357 — roles claim dot-path (same as apisix-gateway oidc.roleClaim).
  OIDC_ROLE_CLAIM: realm_access.roles
  KEYCLOAK_SERVICE_CLIENT_ID: module-service
  # INT-314 — require Bearer JWT on /internal/* (forgeable headers alone rejected).
  SERVICE_JWT_REQUIRED: "true"
  TRADE_INTAKE_INTERNAL_URL: http://trade-intake:8080
  PARTICIPANTS_INTERNAL_URL: http://participants:8080
  REFERENCE_DATA_INTERNAL_URL: http://reference-data:8080
  NATS_URL: nats://nats.nats.svc.cluster.local:4222
  NATS_SUBJECT_PREFIX: intelligent.dev
  NATS_STREAM: DebeziumStream
