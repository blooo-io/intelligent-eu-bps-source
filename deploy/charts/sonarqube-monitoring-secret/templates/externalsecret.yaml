apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels:
    app.kubernetes.io/name: sonarqube-monitoring-secret
    app.kubernetes.io/part-of: intelligent-eu-billing-and-payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: monitoring_passcode
      remoteRef:
        key: {{ .Values.openbaoPath }}
        property: {{ .Values.openbaoProperty }}
