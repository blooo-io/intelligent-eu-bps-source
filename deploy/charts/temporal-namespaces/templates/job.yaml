{{- /*
  INT-172 — idempotent registration of Temporal namespaces int / demo.
  Argo Sync hook + BeforeHookCreation so each sync re-runs safely.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-register-namespaces
  labels:
    app.kubernetes.io/name: temporal-namespaces
    app.kubernetes.io/part-of: intelligent-eu-bps-source
    app.kubernetes.io/component: temporal-namespaces
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-namespaces
        app.kubernetes.io/part-of: intelligent-eu-bps-source
        app.kubernetes.io/component: temporal-namespaces
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.frontendAddress | quote }}
            - name: RETENTION
              value: {{ .Values.retention | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              ADDR="${TEMPORAL_ADDRESS}"
              {{- range .Values.namespaces }}
              NS={{ .name | quote }}
              DESC={{ .description | quote }}
              if temporal operator namespace describe --namespace "${NS}" --address "${ADDR}" >/dev/null 2>&1; then
                echo "namespace ${NS} already registered"
              else
                echo "registering namespace ${NS}"
                temporal operator namespace create \
                  --namespace "${NS}" \
                  --description "${DESC}" \
                  --retention "${RETENTION}" \
                  --address "${ADDR}"
              fi
              {{- end }}
              echo "Temporal namespaces ready"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
