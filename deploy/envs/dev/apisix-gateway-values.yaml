# INT-114 / INT-168 — dev hosts (virtual Stripe-test). DNS → APISIX LB.
environment: dev
hosts:
  api: api.dev.intelligent-eu-bp.blooo.dev
  auth: auth.intelligent-eu-bp.blooo.dev
  app: app.dev.intelligent-eu-bp.blooo.dev
oidc:
  realm: int
  discoveryHost: auth.intelligent-eu-bp.blooo.dev
  bearerOnly: true
  clientId: apisix-gateway
backends:
  appsNamespace: int-apps
tls:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

