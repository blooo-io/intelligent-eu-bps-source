# INT-114 / INT-168 — dev hosts (virtual Stripe-test). DNS → APISIX LB.
environment: dev
hosts:
  api: api.dev.intelligent-eu-bp.blooo.dev
  auth: auth.intelligent-eu-bp.blooo.dev
  app: app.dev.intelligent-eu-bp.blooo.dev
  docs: docs.intelligent-eu-bp.blooo.dev
# INT-187 — SPA origin for CORS (comma-separated).
cors:
  allowOrigins: "https://app.dev.intelligent-eu-bp.blooo.dev,http://localhost:5173"
oidc:
  realm: int
  discoveryHost: auth.intelligent-eu-bp.blooo.dev
  bearerOnly: true
  clientId: apisix-gateway
backends:
  appsNamespace: int-apps
tls:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # INT-174 — staging→prod Secret was Ready while APISIX still served staging until
  # ApisixTls was replaced; keep in sync with chart default after issuer flips.
  reloadGeneration: "2"

