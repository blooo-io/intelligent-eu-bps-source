environment: dev
appsNamespace: int-apps
dataNamespace: int-data
# replicaCount lives on each chart (INT-177): only modules with a Dockerfile
# ship at 1; charts without an image stay at 0.
mailpit:
  enabled: true
image:
  # INT-178 — floating tag published by supply-chain (plus immutable :<sha>).
  # Branch protection blocks bot commits that would pin the SHA in Git.
  tag: "develop"
  pullPolicy: Always
  pullSecret: ghcr-pull
# A8-live (INT-429) — deployed environments run EWDS adapters live; chart defaults stay mock.
env:
  MARKET_ADAPTER: ewds
  DATASPACE_ADAPTER: ewds
  ACTOR_SOURCE_ADAPTER: ewds
  ERASURE_SOURCE_ADAPTER: ewds
  TARIFF_ADAPTER: ewds
  COMMAND_CHANNEL_ENABLED: "true"
  INTAKE_BOOTSTRAP_S1: "false"
