environment: dev
appsNamespace: int-apps
dataNamespace: int-data
# replicaCount lives on each chart (INT-177): only modules with a Dockerfile
# ship at 1; charts without an image stay at 0.
mailpit:
  enabled: true
# INT-381 — temporary diagnostic, dev only. Logs NATS_* variable names and the lengths
# of NATS_USER / NATS_PASSWORD (never values), then keeps the pod alive. Remove with INT-381.
diagnosticCommands:
  publication:
    - -e
    - >-
      const nats=(()=>{try{return require('/app/node_modules/nats')}catch(e){return require('nats')}})();
      const {AckPolicy,DeliverPolicy}=nats;
      const out=(m)=>console.log('DIAG '+m);
      const stream=process.env.NATS_STREAM;
      const durable='diag-probe-int381';
      nats.connect({servers:process.env.NATS_URL,user:process.env.NATS_USER,pass:process.env.NATS_PASSWORD})
      .then(async c=>{
        out('CONNECT_OK');
        const jsm=await c.jetstreamManager();
        try{
          await jsm.consumers.add(stream,{durable_name:durable,filter_subject:process.env.NATS_SUBJECT_PREFIX+'.diag.probe',ack_policy:AckPolicy.Explicit,deliver_policy:DeliverPolicy.All});
          out('ADD_OK');
        }catch(e){out('ADD_ERR '+e.message)}
        try{
          const js=c.jetstream();
          const cons=await js.consumers.get(stream,durable);
          out('GET_OK');
          const msgs=await cons.consume();
          out('CONSUME_OK');
          await msgs.stop();
        }catch(e){out('CONSUME_ERR '+e.message)}
        try{await jsm.consumers.delete(stream,durable);out('DELETE_OK')}catch(e){out('DELETE_ERR '+e.message)}
        await c.close();
      })
      .catch(e=>out('CONNECT_ERR '+e.message));
      setInterval(()=>{},1e9);
image:
  # INT-178 — floating tag published by supply-chain (plus immutable :<sha>).
  # Branch protection blocks bot commits that would pin the SHA in Git.
  tag: "develop"
  pullPolicy: Always
  pullSecret: ghcr-pull
