environment: dev
appsNamespace: int-apps
dataNamespace: int-data
# replicaCount lives on each chart (INT-177): only modules with a Dockerfile
# ship at 1; charts without an image stay at 0.
mailpit:
  enabled: true
image:
  # INT-178 — floating tag published by supply-chain (plus immutable :<sha>).
  # Branch protection blocks bot commits that would pin the SHA in Git.
  tag: "develop"
  pullPolicy: Always
  pullSecret: ghcr-pull
# A8-live (INT-429) — deployed environments run EWDS adapters live; chart defaults stay mock.
env:
  # INT-440 — GSY market topics still pending EWAG topiccreator (externally blocked).
  # Keep mock market so e2e-dev StartRun has unbilled S1 trades via AC-04 refresh.
  MARKET_ADAPTER: mock
  DATASPACE_ADAPTER: ewds
  ACTOR_SOURCE_ADAPTER: ewds
  ERASURE_SOURCE_ADAPTER: ewds
  TARIFF_ADAPTER: ewds
  # INT-440 / REQ-013 — IdP + PSP erasure over HTTP (no in-process mocks in cluster).
  ERASURE_ADAPTERS: http
  # INT-440 / A7 — hosted KYC returnUrl origins (comma-separated).
  KYC_RETURN_URL_ALLOWLIST: "https://app.dev.intelligent-eu-bp.blooo.dev"
  # INT-439 — command poller refuses to boot without reply-channel encryption (NFR-017).
  COMMAND_CHANNEL_ENABLED: "true"
  EWDS_REPLY_ENCRYPTED: "true"
  # INT-440 — seed S1 window on boot when mock market is selected (pairs with seed refresh).
  INTAKE_BOOTSTRAP_S1: "true"
  # INT-440 — empty allow-list rejects all commands until R2M provides the gateway DID.
  # EWDS_COMMAND_ALLOWED_DIDS left unset / empty on purpose (externally blocked).
