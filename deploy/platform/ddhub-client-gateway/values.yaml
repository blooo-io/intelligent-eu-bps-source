# DDHub Client Gateway — official chart 1.3.0-ewc (INT-308 / NFR-017).
# Separate unmodified service (TP-2 exception: GPL-3.0 LICENSE on upstream).
# No secret values in Git. Secret ddhub-client-gateway-secret ← OpenBao platform/ddhub.
# Phase 1: auth/mTLS off; UI off; no public Ingress. Enrolment = INT-309.

fullnameOverride: ddhub-client-gateway
nameOverride: ddhub-client-gateway

replicaCount: 1

clientgateway:
  config:
    port: 3333
    websocket: NONE
    dsb_base_url: https://ddhub-ewc.energyweb.org
    chain_id: 246
    rpc_url: https://rpc.energyweb.org/
    cache_server_url: https://identitycache.energyweb.org/v1
    event_server_url: https://identitycache.energyweb.org/
    parent_namespace: dsmb.apps.ddhub.energyweb.auth.ewc
    next_public_parent_namespace: dsmb.apps.ddhub.energyweb.auth.ewc
    secret_engine: vault
    # OpenBao (Vault-compatible) in platform namespace — TD-9.
    secret_engine_endpoint: http://platform-openbao.openbao.svc.cluster.local:8200
    secret_prefix: "ddhub/"
    node_env: production
    # Phase 1 — enable after EWAG CSR / enrolment (INT-309).
    mtls_enabled: false
  scheduler:
    enabled: true
    image:
      repository: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-scheduler
      pullPolicy: IfNotPresent
      tag: intelligent-canary
    appConfig:
      DID_REGISTRY_ADDRESS: "0xc15d5a57a8eb0e1dcbe5d88b8f9a82017e5cc4af"
      # Phase 1 — API auth off until keys are minted (INT-309).
      USER_AUTH_ENABLED: "false"
      FETCH_MESSAGES_CRON_ENABLED: "true"
      CLEANUP_MESSAGES_CRON_ENABLED: "true"
      FETCH_MESSAGES_CRON_SCHEDULE: "* * * * *"
      # Align with REQ-053 / A26 (≤ 7 days) once EWAG confirms purge semantics.
      CLEANUP_MESSAGES_CRON_SCHEDULE: "*/15 * * * *"
  ui:
    # System/API integration for Billing; UI stays off public DNS.
    enabled: false

image:
  repository: ewfcontainerregistry.azurecr.io/ddhub-client-gateway-backend
  pullPolicy: IfNotPresent
  tag: intelligent-canary

# Use chart ConfigMap + ExternalSecret ddhub-client-gateway-secret (INT-308).
config:
  enabled: false

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  liveness: true
  livenessInitialDelay: 30
  livenessPeriodSeconds: 10
  readiness: true
  readinessInitialDelay: 60
  readinessPeriodSeconds: 10
