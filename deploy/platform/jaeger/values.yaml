# Jaeger — official chart (Apache-2.0).
# Chart: jaegertracing/jaeger 4.16.1 (INT-134 / TD-10).
# Default storage is in-memory (ephemeral) — suitable for V1 / virtual dev.
# No Elasticsearch / Cassandra provisioned. No secret values in this file.

fullnameOverride: platform-jaeger

jaeger:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Keep spark / ES maintenance jobs off until a durable store exists.
spark:
  enabled: false
esIndexCleaner:
  enabled: false
esRollover:
  enabled: false
esLookback:
  enabled: false
