# Keycloak.X — codecentric/keycloakx 7.4.0, image quay.io/keycloak/keycloak (Apache-2.0).
# INT-160. Admin bootstrap and DB password come from Kubernetes Secrets
# (CNPG-managed role secret + ExternalSecret for admin) — never from Git.

replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.1"

# INT-167 — codecentric/keycloakx defaults args to []; without `start` the
# process prints help and CrashLoops.
# INT-169 — import realms int/demo from ConfigMap keycloak-realm-import.
# INT-332 — Volt login theme `intelligent` (parent keycloak.v2) from ConfigMap.
args:
  - start
  - --import-realm

extraVolumes: |
  - name: realm-import
    configMap:
      name: keycloak-realm-import
  - name: theme-intelligent
    configMap:
      name: keycloak-theme-intelligent

extraVolumeMounts: |
  - name: realm-import
    mountPath: /opt/keycloak/data/import
    readOnly: true
  - name: theme-intelligent
    mountPath: /opt/keycloak/themes/intelligent/login/theme.properties
    subPath: theme.properties
    readOnly: true
  - name: theme-intelligent
    mountPath: /opt/keycloak/themes/intelligent/login/resources/css/login.css
    subPath: login.css
    readOnly: true

# Start only after CNPG role Secret `keycloak` exists in this namespace.
database:
  vendor: postgres
  hostname: keycloak-rw.keycloak.svc.cluster.local
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak
  existingSecretKey: password

# Bootstrap admin via Secret created by ExternalSecret (OpenBao path platform/keycloak).
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin
        key: password
  - name: KC_HOSTNAME_STRICT
    value: "false"
  # Do not set KC_HTTP_ENABLED here — proxy.http.enabled already injects it
  # (duplicate breaks Argo ServerSideApply on the StatefulSet; INT-165).
  # INT-331 — V1 / virtual dev: heap relative to the smaller container limit.
  - name: JAVA_OPTS_KC_HEAP
    value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=40 -XX:MaxMetaspaceSize=256m"

http:
  relativePath: "/"

proxy:
  enabled: true
  mode: forwarded
  http:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Realms `int` / `demo` are created by the operator after first boot (or a later
# realm-import change). Hostname auth.intelligent-eu-bp.blooo.dev waits on APISIX (INT-114).
