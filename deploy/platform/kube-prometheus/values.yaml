# kube-prometheus-stack — official chart (Apache-2.0).
# Chart: prometheus-community/kube-prometheus-stack 92.10.0 (INT-134 / TD-10).
# Grafana is AGPL and must stay disabled (TD-10). Alertmanager is Apache-2.0 (physical § monitoring).
# No secret values in this file.

fullnameOverride: kube-prometheus

crds:
  enabled: true

grafana:
  enabled: false

alertmanager:
  enabled: true
  # INT-358 — physical §7: actionable alerts (severity critical / warning) go to
  # the dedicated Blooo Slack channel. The incoming-webhook URL is read from a
  # file mounted from Secret `alertmanager-slack` (ExternalSecret in
  # deploy/charts/alertmanager-slack-secret, OpenBao `platform/alertmanager`).
  # The volume is optional: without the Secret, Alertmanager still starts and
  # only the Slack sends fail (alertmanager_notifications_failed_total).
  # Chart defaults are kept for inhibit_rules and templates.
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/slack/webhook_url
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: slack
          matchers:
            - severity =~ "critical|warning"
    receivers:
      - name: 'null'
      - name: slack
        slack_configs:
          - send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Labels.severity }}: {{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  alertmanagerSpec:
    volumes:
      - name: slack-webhook
        secret:
          secretName: alertmanager-slack
          optional: true
    volumeMounts:
      - name: slack-webhook
        mountPath: /etc/alertmanager/slack
        readOnly: true
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    # INT-331 — V1 / virtual dev: shorter retention + size cap to cut RSS (~900Mi → ~500Mi).
    retention: 2d
    retentionSize: 5GB
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Modules scrape via ServiceMonitor labels once workloads exist.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # INT-327 — pick up PrometheusRules from deploy/charts/prometheus-rules.
    ruleSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
