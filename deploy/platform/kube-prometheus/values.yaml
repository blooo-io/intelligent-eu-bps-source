# kube-prometheus-stack — official chart (Apache-2.0).
# Chart: prometheus-community/kube-prometheus-stack 92.10.0 (INT-134 / TD-10).
# Grafana is AGPL and must stay disabled (TD-10). Alertmanager is Apache-2.0 (physical § monitoring).
# No secret values in this file.

fullnameOverride: kube-prometheus

crds:
  enabled: true

grafana:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    # INT-331 — V1 / virtual dev: shorter retention + size cap to cut RSS (~900Mi → ~500Mi).
    retention: 2d
    retentionSize: 5GB
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Modules scrape via ServiceMonitor labels once workloads exist.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # INT-327 — pick up PrometheusRules from deploy/charts/prometheus-rules.
    ruleSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
