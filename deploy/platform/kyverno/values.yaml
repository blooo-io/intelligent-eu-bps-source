# Kyverno — official chart 3.9.2 (Apache-2.0). INT-315 / INT-312 follow-up.
# Baseline admission policies: deploy/charts/kyverno-policies.
# INT-330 — raise controller memory; chart default background limit 128Mi fails
# cache sync under node pressure on the V1 3-node pool.

fullnameOverride: platform-kyverno

admissionController:
  replicas: 1
  # Chart nests admission resources under container (initContainer separate).
  container:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

backgroundController:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

cleanupController:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

reportsController:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
