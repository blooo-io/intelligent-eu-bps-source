# OpenBao — official chart (MPL-2.0, TD-1 / TD-9 accepted exception).
# Chart: openbao/openbao 0.30.4 (app v2.7.1). Deployed unmodified (INT-133).
# No unseal keys, root tokens or path secrets in Git.
#
# V1 / virtual Stripe-test cluster (k8s-intelligent-eu-dev): single-share init
# (no Shamir ceremony). After Argo syncs this chart:
#   KUBECONFIG=… node scripts/openbao-dev-bootstrap.mjs --apply
# Demo / stronger custody can switch later to multi-share offline keys (physical §5).

global:
  enabled: true
  tlsDisable: true

# ESO pulls secrets; no agent injector in V1.
injector:
  enabled: false

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dataStorage:
    enabled: true
    size: 10Gi
  # Non-production: single integrated-storage node (physical §6).
  standalone:
    enabled: true
  ha:
    enabled: false

ui:
  enabled: false
