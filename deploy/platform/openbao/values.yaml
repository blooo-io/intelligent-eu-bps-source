# OpenBao — official chart (MPL-2.0, TD-1 / TD-9 accepted exception).
# Chart: openbao/openbao 0.30.4 (app v2.7.1). Deployed unmodified (INT-133).
# No unseal keys, root tokens or path secrets in Git.
#
# Operator after first sync (see deploy/platform/README.md):
#   1. bao operator init (share unseal keys offline — physical §5)
#   2. unseal; enable KV v2 at `secret/`
#   3. configure auth for ESO; write token into Secret openbao-eso-token
#      in namespace external-secrets (never commit that Secret)

global:
  enabled: true
  tlsDisable: true

# ESO pulls secrets; no agent injector in V1.
injector:
  enabled: false

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dataStorage:
    enabled: true
    size: 10Gi
  # Non-production: single integrated-storage node (physical §6).
  standalone:
    enabled: true
  ha:
    enabled: false

ui:
  enabled: false
