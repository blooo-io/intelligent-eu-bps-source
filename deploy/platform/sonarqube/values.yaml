# SonarQube Community Build — official chart 2026.5.1002 (INT-292).
# Separate unmodified service (TP-2 exception). No secret values in Git.
# JDBC credentials: CNPG-managed Secret `sonarqube` (basic-auth).
# Monitoring passcode: ExternalSecret `sonarqube-monitoring` ← OpenBao platform/sonarqube.

fullnameOverride: platform-sonarqube

community:
  enabled: true
  buildNumber: "26.9.0.129388"

replicaCount: 1

# INT-331 — V1 / virtual dev heap caps. Chart defaults (Web 2G / CE 4G / Search 2G)
# push RSS past 2Gi on a 6Gi node; keep quality-gate capable without that footprint.
sonarProperties:
  sonar.web.javaOpts: "-Xmx512m -Xms128m -XX:+HeapDumpOnOutOfMemoryError"
  sonar.ce.javaOpts: "-Xmx256m -Xms64m -XX:+HeapDumpOnOutOfMemoryError"
  sonar.search.javaOpts: "-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError"

# INT-331 — namespace PSA is baseline (INT-312); chart initSysctl is privileged.
# Scaleway nodes already set vm.max_map_count high enough for embedded ES.
initSysctl:
  enabled: false
elasticsearch:
  configureNode: false
  bootstrapChecks: false

resources:
  requests:
    cpu: 250m
    memory: 1280Mi
    ephemeral-storage: 2Gi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 8Gi

persistence:
  enabled: true
  size: 20Gi

jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://sonarqube-rw.sonarqube.svc.cluster.local:5432/sonarqube"
  jdbcUsername: sonarqube
  jdbcSecretName: sonarqube
  jdbcSecretPasswordKey: password

monitoringPasscodeSecretName: sonarqube-monitoring
monitoringPasscodeSecretKey: monitoring_passcode

# Chart helm tests are not part of Argo sync.
tests:
  enabled: false

# Public UI/API via APISIX host sonar.intelligent-eu-bp.blooo.dev (INT-292).
# Ingress stays off — APISIX ExternalName + ApisixRoute owns the edge.
ingress:
  enabled: false

service:
  type: ClusterIP
  externalPort: 9000
  internalPort: 9000

# Agents / MCP stay off for V1 quality gate only.
agentOrchestrator:
  enabled: false
hunterAgent:
  enabled: false
remediationAgent:
  enabled: false
