# Temporal — official chart temporal/temporal 1.7.0 (MIT).
# INT-159 / TD-3. SQL on CNPG in this namespace. No passwords in Git.
# numHistoryShards is immutable after first init — keep small for V1 / virtual dev.

server:
  enabled: true
  replicaCount: 1
  config:
    persistence:
      # V1 / virtual dev only. Do not raise after the Cluster has been initialised.
      numHistoryShards: 1
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            databaseName: temporal
            connectAddr: "temporal-rw.temporal.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: temporal
            existingSecret: temporal
            secretKey: password
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: "temporal-rw.temporal.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: temporal
            existingSecret: temporal
            secretKey: password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

admintools:
  enabled: true

web:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

schema:
  # Argo CD does not honour Helm hooks the same way; schema jobs still run as Jobs.
  useHelmHooks: false

# Temporal namespaces `int` / `demo` are registered by the operator after first
# boot (tctl / temporal operator namespace create). Workers stay at replicas 0
# until module images exist (INT-113).
