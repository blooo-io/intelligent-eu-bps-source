# INT-291 — SonarQube / SonarCloud project descriptor (quality measurement).
# Host URL + token come from CI secrets/vars; do not put credentials here.
sonar.projectKey=blooo-io_intelligent-eu-billing-and-payment
sonar.projectName=Intelligent EU Billing and Payment
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# SonarCloud organisation (override with SONAR_ORGANIZATION / -Dsonar.organization).
sonar.organization=blooo-io

sonar.sources=apps,services,packages,scripts
sonar.tests=apps,services,packages,scripts
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.test.js

sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/*.d.ts,\
  **/lcov-report/**,\
  deploy/**,\
  docs/**,\
  contracts/**,\
  mocks/**,\
  brain/**,\
  **/*.canvas.tsx

sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.test.js,\
  **/vitest.config.ts,\
  **/main.ts,\
  **/index.ts

# Populated by CI from Vitest lcov reports (see scripts/sonar-lcov-paths.mjs).
# sonar.javascript.lcov.reportPaths=

sonar.typescript.tsconfigPaths=\
  apps/*/tsconfig.json,\
  services/*/tsconfig.json,\
  packages/*/tsconfig.json
